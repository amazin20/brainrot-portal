name: Video repair source
on:
  push:
    branches: ['fix/carry-wind-shot-review']
    paths: ['.github/workflows/repair-source.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip -o /tmp/repair-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: repair-source
          path: /tmp/repair-source.zip
          retention-days: 1
