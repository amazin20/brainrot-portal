name: Build current GitHub demo
on:
  push:
    branches: [upgrade/tz-completion-20261023]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: current-demo-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - name: Retain tracked public source without credentials or generated evidence
        run: |
          mkdir -p source-snapshot
          git archive --format=tar HEAD src public tests scripts tools package.json package-lock.json index.html vite.config.js .github | gzip -n > source-snapshot/source.tar.gz
          git rev-parse HEAD > source-snapshot/source-sha.txt
          git ls-tree -r HEAD -- src public tests scripts tools package.json package-lock.json index.html vite.config.js .github > source-snapshot/source-tree.txt
          sha256sum source-snapshot/source.tar.gz > source-snapshot/source.sha256
      - uses: actions/upload-artifact@v4
        with: {name: current-demo-source, path: source-snapshot/, retention-days: 14, if-no-files-found: error}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Preserve access, Atlas and v67 save compatibility
        run: |
          mkdir -p evidence
          set -o pipefail
          node --test --test-concurrency=1 tests/lab-campaign-v67-storage.test.js tests/lab-campaign-access.test.js tests/lab-campaign-sequence.test.js tests/lab-atlas-runtime.test.js tests/lab-player-entry.test.js tests/lab-v8-platform.test.js tests/lab-shot-obstruction-feedback.test.js tests/lab-shot-collision.test.js tests/lab-velocity-shots.test.js tests/lab-room13-camera-reunion.test.js tests/lab-room17-camera-recovery.test.js tests/lab-room18-direct-turn.test.js tests/lab-room18-send-ahead.test.js tests/lab-room18-bypasses.test.js tests/lab-post-a-deck-finish.test.js tests/lab-research31-island-freight.test.js tests/crossflow-baseline-policy.test.js tests/current-demo-source-gate.test.js | tee evidence/tests.tap
      - name: Build every current improvement from this single commit
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          npm run build
          node tools/current-demo/stamp.mjs
          npm install --prefix "$RUNNER_TEMP/browser" --no-save --package-lock=false puppeteer-core@24.16.0
          git diff --exit-code -- package.json package-lock.json
      - name: Check real native startup and the Biosphere, Optics and castle remasters
        run: |
          mkdir -p smoke-site
          ln -s ../dist smoke-site/campaign-v67
          python3 -m http.server 4173 --bind 127.0.0.1 --directory smoke-site > evidence/server.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/campaign-v67/ >/dev/null && break; sleep 1; done
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          export PUPPETEER_MODULE="$RUNNER_TEMP/browser/node_modules/puppeteer-core/lib/esm/puppeteer/puppeteer-core.js"
          node tools/current-demo/smoke.mjs
      - uses: actions/upload-artifact@v4
        with: {name: current-demo-browser, path: dist/, retention-days: 90, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: current-demo-checks, path: evidence/, retention-days: 30, if-no-files-found: error}

  route-access:
    name: Ordinary repaired routes / room ${{ matrix.level }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - level: 11
            tests: tests/lab-wind-room.test.js tests/lab-wind-alternatives.test.js tests/lab-room11-clutch.test.js tests/lab-room11-adversarial.test.js
          - level: 13
            tests: tests/lab-room13.test.js tests/lab-room13-portrait-attacks.test.js tests/second-chapter-early-attacks.test.js
          - level: 16
            tests: tests/lab-room16-alternate.test.js tests/lab-room16-bypass.test.js tests/lab-room16-recovery.test.js
          - level: 35
            tests: tests/lab-room35-live-flow.test.js
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Keep the full existing positive and negative acceptance criteria
        env:
          ROUTE_TESTS: ${{ matrix.tests }}
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-sha.txt
          set -o pipefail
          node --test --test-concurrency=1 $ROUTE_TESTS | tee evidence/tests.tap
      - name: Build the exact candidate and observation tools
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          npm run build
          python3 -m pip install playwright==1.57.0
          git diff --exit-code -- package.json package-lock.json
      - name: Complete original-traveller routes from untouched Play
        env:
          BUILD_COMMIT: ${{ github.sha }}
          ROUTE_LEVELS: ${{ matrix.level }}
        run: |
          mkdir -p route-site
          ln -s ../dist route-site/campaign-v67
          python3 -m http.server 4173 --bind 127.0.0.1 --directory route-site > evidence/server.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/campaign-v67/ >/dev/null && break; sleep 1; done
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          python3 tools/qa-route-access-repairs.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: route-access-${{ matrix.level }}-${{ github.sha }}
          path: evidence/
          retention-days: 30
          if-no-files-found: error

  camera-recovery:
    name: Native camera reunion and real viewport recovery
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Build the exact candidate and retain its original comparison
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          npm run build
          python3 -m pip install playwright==1.57.0
          git diff --exit-code -- package.json package-lock.json
      - uses: actions/checkout@v4
        with:
          ref: f0adf70b984c50d2306f72f307e8ba3475d43183
          path: baseline
          persist-credentials: false
      - name: Build the unchanged previous demo
        working-directory: baseline
        run: |
          ln -s ../node_modules node_modules
          npm run build
      - name: Compare actual original models with ordinary controls and browser resize
        env:
          BUILD_COMMIT: ${{ github.sha }}
          BASELINE_DIST: baseline/dist
          CAMERA_PROOF_DIR: evidence/camera-recovery
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          python3 tools/qa-camera-recovery.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: camera-recovery-native
          path: evidence/camera-recovery/
          retention-days: 30
          if-no-files-found: error

  observatory-surfaces:
    name: Native observatory joints and retained contact shadows
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Build the exact candidate and surface observer
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          npm run build
          python3 -m pip install playwright==1.57.0 Pillow
          git diff --exit-code -- package.json package-lock.json
      - uses: actions/checkout@v4
        with:
          ref: eb976be2b21153c6a98efa65c2adf1fd5e656b3b
          path: surface-baseline
          persist-credentials: false
      - name: Build the unchanged previous demo
        working-directory: surface-baseline
        run: |
          ln -s ../node_modules node_modules
          npm run build
      - name: Compare identical views with production shadows and original actors
        env:
          BUILD_COMMIT: ${{ github.sha }}
          BASELINE_COMMIT: eb976be2b21153c6a98efa65c2adf1fd5e656b3b
          BASELINE_DIST: surface-baseline/dist
          SURFACE_PROOF_DIR: evidence/observatory-surfaces
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          python3 tools/qa-observatory-surface.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: observatory-surfaces-native
          path: evidence/observatory-surfaces/
          retention-days: 30
          if-no-files-found: error

  full-source-gate:
    name: Require the complete current-source suite before demo publication
    needs: [build, route-access, camera-recovery, observatory-surfaces]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - id: suite
        name: Wait for the exact current source and latest validation attempt
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const {pathToFileURL} = require('node:url');
            const {selectCurrentSourceRun, assertCompleteSourceJobs} = await import(pathToFileURL(process.cwd()+'/scripts/lib/current-demo-source-gate.mjs'));
            const source = context.sha, branch = 'upgrade/tz-completion-20261023';
            const repository = context.repo.owner+'/'+context.repo.repo;
            const deadline = Date.now()+70*60*1000;
            fs.mkdirSync('evidence/full-source-gate', {recursive:true});
            const observations = [];
            const save = () => fs.writeFileSync('evidence/full-source-gate/poll.json', JSON.stringify({sourceCommit:source,observations},null,2)+'\n');
            while(Date.now()<deadline) {
              const head = (await github.rest.git.getRef({...context.repo,ref:'heads/'+branch})).data.object.sha;
              if(head!==source) throw Error('A newer source arrived; never accept or publish the obsolete candidate');
              const listed = (await github.rest.actions.listWorkflowRuns({...context.repo,workflow_id:'tz-completion-review.yml',head_sha:source,per_page:100})).data.workflow_runs;
              const selected = selectCurrentSourceRun(listed,{source,branch,repository});
              if(selected) {
                const run = (await github.rest.actions.getWorkflowRun({...context.repo,run_id:selected.id})).data;
                observations.push({at:new Date().toISOString(),id:run.id,attempt:run.run_attempt,status:run.status,conclusion:run.conclusion}); save();
                if(run.status==='completed') {
                  if(run.conclusion!=='success') throw Error('The exact-source validation finished '+run.conclusion+'; publication remains blocked');
                  const jobs = await github.paginate('GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs', {...context.repo,run_id:run.id,attempt_number:run.run_attempt,per_page:100});
                  assertCompleteSourceJobs(run,jobs);
                  const latest = (await github.rest.actions.getWorkflowRun({...context.repo,run_id:run.id})).data;
                  if(latest.run_attempt!==run.run_attempt||latest.status!=='completed'||latest.conclusion!=='success') throw Error('The validation attempt changed during acceptance');
                  fs.writeFileSync('evidence/full-source-gate/run.json', JSON.stringify({sourceCommit:source,runId:String(run.id),runAttempt:run.run_attempt,jobs:jobs.map(({name,status,conclusion})=>({name,status,conclusion}))},null,2)+'\n');
                  core.setOutput('run',String(run.id));core.setOutput('attempt',String(run.run_attempt));return;
                }
              } else {observations.push({at:new Date().toISOString(),status:'waiting-for-exact-source-run'});save();}
              await new Promise(resolve=>setTimeout(resolve,30000));
            }
            throw Error('No complete exact-source validation arrived within the bounded wait');
      - name: Download the complete suite receipt from that validation run
        uses: actions/download-artifact@v4
        with:
          name: active-suite-summary
          run-id: ${{ steps.suite.outputs.run }}
          github-token: ${{ github.token }}
          path: evidence/full-source-gate/summary
      - name: Require exact source, latest attempt, all active files and zero failed or skipped tests
        env:
          SOURCE_RUN: ${{ steps.suite.outputs.run }}
          SOURCE_ATTEMPT: ${{ steps.suite.outputs.attempt }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {activeGameTests} from './scripts/lib/active-game-tests.mjs';
          import {assertCompleteSourceSummary} from './scripts/lib/current-demo-source-gate.mjs';
          const summary=JSON.parse(fs.readFileSync('evidence/full-source-gate/summary/active-suite-summary.json','utf8'));
          const receipt=assertCompleteSourceSummary(summary,{source:process.env.GITHUB_SHA,runId:process.env.SOURCE_RUN,runAttempt:process.env.SOURCE_ATTEMPT,activeFileCount:activeGameTests().length});
          fs.writeFileSync('evidence/full-source-gate/accepted.json',JSON.stringify(receipt,null,2)+'\n');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-demo-full-source-gate
          path: evidence/full-source-gate/
          retention-days: 30
          if-no-files-found: error
