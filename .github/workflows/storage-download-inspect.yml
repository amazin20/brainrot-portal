name: Resolve archive download action
on:
  push:
    branches: ['release/tactile-twenty-v17']
    paths: ['.github/workflows/storage-download-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read public share client download action
        run: |
          python3 - <<'PY'
          import urllib.request,re,urllib.parse,pathlib
          base='https://firestorage.ai'
          page=urllib.request.urlopen(base+'/ja/f/NxI602TwrMI_',timeout=30).read().decode()
          for path in re.findall(r'<script[^>]+src="([^"]+)"',page):
              if '/ja/f/page-' not in path and '8437-' not in path and '4899-' not in path: continue
              js=urllib.request.urlopen(base+urllib.parse.quote(path,safe='/-.()'),timeout=30).read().decode()
              print('CLIENT',path,len(js))
              for m in re.finditer(r'.{0,180}(?:/api/|downloadUrl|download_url|/download|prepareDownload|shareId|fileId).{0,260}',js):print(m.group())
              pathlib.Path('/tmp/'+path.split('/')[-1]).write_text(js)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: storage-download-action
          path: /tmp/*.js
          retention-days: 1
