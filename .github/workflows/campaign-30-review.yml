name: Chromatic campaign room review
on:
  push:
    branches: [feature/campaign-30-wonder]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: campaign30-review-${{ github.ref }}
  cancel-in-progress: true
env:
  BUILD_COMMIT: ${{ github.sha }}
jobs:
  rooms:
    name: Room ${{ matrix.room }} native route and mechanism motion
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        room: [24, 27, 28, 29, 30]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build the exact reviewed revision
        run: |
          npm ci
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
          npm run build
          node scripts/stamp-build.mjs v39-campaign-30
      - name: Complete each ordinary route with native mechanism excerpts
        env:
          NESI_FIRST: ${{ matrix.room }}
          NESI_LAST: ${{ matrix.room }}
          NESI_UI: '0'
          NESI_CAPTURE_PUZZLE: '1'
          NESI_CAPTURE_FULL: '0'
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >campaign30-preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/v8-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign30-room-${{ matrix.room }}
          path: |
            smoke-artifacts/
            campaign30-preview.log
          retention-days: 14
      - name: Preserve native review media
        if: always()
        env:
          REVIEW_KIND: room${{ matrix.room }}
        run: bash scripts/preserve-campaign-evidence.sh smoke-artifacts
