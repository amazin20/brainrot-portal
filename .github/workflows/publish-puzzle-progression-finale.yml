# The existing single Pages controller now APPENDS only a separately reviewed
# Tower41 preview. Every current canonical, finale and historical byte remains.
# Exact source/run/attempt pins below MUST be filled after independent acceptance.
name: Publish accepted isolated Tower41 native preview
'on':
  push:
    branches: [main]
    paths: [.github/workflows/publish-puzzle-progression-finale.yml]
  workflow_dispatch:
permissions: {contents: read, actions: read, deployments: read}
concurrency:
  group: pages
  cancel-in-progress: false
env:
  BUILD_COMMIT: '5e552e9c3ac248b535d619741f15e99e29979cbf'
  SOURCE_REVIEW_RUN_ID: '38291320140'
  SOURCE_REVIEW_RUN_ATTEMPT: '1'
  PUBLIC_BASE: https://amazin20.github.io/brainrot-portal/
jobs:
  assemble:
    name: Assemble the exact reviewed preview without changing the current site
    if: github.repository == 'amazin20/brainrot-portal' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {ref: '${{ env.BUILD_COMMIT }}', path: source, fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: source/package-lock.json}
      - name: Check the tested publisher guards and install the frozen source verifier
        run: |
          node --test scripts/test-publish-tower41-native.mjs
          python3 scripts/test-publish-tower41-native.py
          npm ci --prefix source
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Guard all five exact source jobs, current main and latest public deployment
        env: {GITHUB_TOKEN: '${{ github.token }}'}
        run: node scripts/publish-tower41-native.mjs guard prepare
      - name: Retain checksum-pinned latest Pages archive, acceptance proof and every exact-attempt review artifact
        env: {GITHUB_TOKEN: '${{ github.token }}'}
        run: node scripts/publish-tower41-native.mjs download
      - name: Independently bind the frozen source, complete build, CPU log, originals and both native proofs
        run: node scripts/publish-tower41-native.mjs restore
      - name: Validate every baseline archive member and append only immutable reviewed bytes
        run: |
          python3 scripts/publish-tower41-native.py baseline --zip proof/downloads/baseline.zip --accepted-proof proof/review-artifacts/accepted-publication --output baseline-pages
          python3 scripts/publish-tower41-native.py assemble --baseline baseline-pages --candidate source/dist --site site --proof proof --binding proof/package-binding.json --source "$BUILD_COMMIT" --publisher "$GITHUB_SHA" --run "$GITHUB_RUN_ID" --review-run "$SOURCE_REVIEW_RUN_ID" --review-attempt "$SOURCE_REVIEW_RUN_ATTEMPT"
      - uses: actions/upload-pages-artifact@v3
        with: {path: site, retention-days: 14}
      - name: Retain the whole accepted baseline ZIP and every preparation receipt privately
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tower41-native-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: proof/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
  deploy:
    name: Verify every existing byte, append the preview and execute its actual public ordinary journey
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions: {contents: read, actions: read, deployments: read, pages: write, id-token: write}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}tower41-native-v2/?edition=foundation&level=41&tower41preview=1
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {ref: '${{ env.BUILD_COMMIT }}', path: source, fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: source/package-lock.json}
      - uses: actions/download-artifact@v4
        with:
          name: tower41-native-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: proof
      - name: Install the exact source native verifier and declared movie runtime
        run: |
          npm ci --prefix source
          npm install --prefix source --no-save --package-lock=false puppeteer-core@24.16.0
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          echo "CHROME_PATH=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
      - name: Rebind every retained source artifact, production file and native proof
        run: node scripts/publish-tower41-native.mjs restore-retained
      - name: Verify all 1706 existing public files and their 561674513 exact bytes
        run: python3 scripts/publish-tower41-native.py verify --manifest proof/baseline-manifest.json --base "$PUBLIC_BASE" --phase preflight --output proof/predeploy-public-bytes.json --source "$BUILD_COMMIT" --publisher "$GITHUB_SHA" --run "$GITHUB_RUN_ID" --review-run "$SOURCE_REVIEW_RUN_ID" --review-attempt "$SOURCE_REVIEW_RUN_ATTEMPT"
      - uses: actions/configure-pages@v5
      - name: Reject changed review attempt, source, publisher or any overlapping Pages publication at the final gate
        env: {GITHUB_TOKEN: '${{ github.token }}'}
        run: node scripts/publish-tower41-native.mjs guard deploy
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify the union of every unchanged old file and every added preview file
        run: python3 scripts/publish-tower41-native.py verify --manifest proof/manifest.json --base "$PUBLIC_BASE" --phase published --output proof/public-bytes.json --source "$BUILD_COMMIT" --publisher "$GITHUB_SHA" --run "$GITHUB_RUN_ID" --review-run "$SOURCE_REVIEW_RUN_ID" --review-attempt "$SOURCE_REVIEW_RUN_ATTEMPT"
      - name: Complete the public ordinary eleven-mechanism castle and preserve all old save bytes through replay and reload
        working-directory: source
        env:
          TOWER41_PREVIEW: '1'
          PAGE_URL: https://amazin20.github.io/brainrot-portal/tower41-native-v2/
          ROUTE: '1'
          RECORD: '1'
          CAPTURE_FPS: '4'
          CAPTURE_WIDTH: '640'
          CAPTURE_HEIGHT: '360'
          OUT_DIR: ../proof/public-native
          GITHUB_RUN_ID: '${{ env.SOURCE_REVIEW_RUN_ID }}'
          GITHUB_RUN_ATTEMPT: '${{ env.SOURCE_REVIEW_RUN_ATTEMPT }}'
          GITHUB_SHA: '${{ env.BUILD_COMMIT }}'
          GITHUB_REF: refs/heads/upgrade/tower41-pendulum-20261012
        run: timeout --signal=TERM --kill-after=10s 4800s node scripts/singularity-browser.mjs
      - name: Independently check the public save proof and decode the entire actual public movie
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import {assertPreviewSaveIsolation} from './source/scripts/qa-tower41-next-cell-source.mjs';
          import {assertUpgradeEvidence} from './source/scripts/lib/singularity-upgrade-proof.mjs';
          import {assertPendulumPhysicalProof} from './source/scripts/lib/tower41-pendulum-proof.mjs';
          const info=JSON.parse(fs.readFileSync('source/dist/build-info.json'));
          const evidence=JSON.parse(fs.readFileSync('proof/public-native/evidence.json'));
          assert.equal(evidence.sourceCommit,process.env.BUILD_COMMIT);
          assertUpgradeEvidence(evidence,info,{record:true});
          const pendulumEvents=evidence.observed.events.filter(event=>event.id==='pendulum');assert.equal(pendulumEvents.length,1);
          assertPendulumPhysicalProof(pendulumEvents[0].proof,evidence.observed.bodyId);
          assertPreviewSaveIsolation(evidence.previewSaveIsolation);
          const isolation=evidence.previewSaveIsolation,bare=isolation.bareEntry;
          assert.equal(bare.applicable,true,'Actual public acceptance requires the bare native entry, not a local-root exemption');
          assert.equal(bare.pass,true);
          assert.equal(bare.url,'https://amazin20.github.io/brainrot-portal/tower41-native-v2/');
          assert.equal(bare.pathname,'/brainrot-portal/tower41-native-v2/');
          assert.equal(bare.search,'');assert.equal(bare.state,'ready');assert.equal(bare.level,41);assert.equal(bare.preview,true);
          assert.equal(bare.ownKey,'brainrot-tower41-native-v2:brainrot-portal.preferences.v24');
          assert.equal(bare.oldBytesUnchanged,true);assert.equal(bare.editionNavigationPresent,false);assert.deepEqual(bare.editionNavigationAnchors,[]);
          assert.equal(bare.settings.control,'native-menu-quality-select');assert.notEqual(bare.settings.beforeSha256,bare.settings.changedSha256);assert.equal(bare.settings.beforeSha256,bare.settings.restoredSha256);
          assert.equal(new URL(isolation.playerURL).origin,'https://amazin20.github.io');
          assert.equal(new URL(isolation.playerURL).pathname,bare.pathname);
          const filename='proof/public-native/'+evidence.video.filename;
          assert.equal(createHash('sha256').update(fs.readFileSync(filename)).digest('hex'),evidence.video.sha256);
          execFileSync('ffmpeg',['-hide_banner','-loglevel','error','-xerror','-i',filename,'-f','null','-'],{stdio:'inherit',timeout:300000});
          JS
      - name: Prepare the bounded independent verification packet after successful public acceptance
        run: python3 scripts/publish-tower41-native.py verification-bundle --proof proof --output verification-bundle --source "$BUILD_COMMIT" --publisher "$GITHUB_SHA" --run "$GITHUB_RUN_ID" --review-run "$SOURCE_REVIEW_RUN_ID" --review-attempt "$SOURCE_REVIEW_RUN_ATTEMPT"
      - name: Retain the bounded metadata, raw provider receipts and complete actual public movie
        uses: actions/upload-artifact@v4
        with:
          name: tower41-native-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-bundle/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Retain publication byte checks, source bindings and actual public recording including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tower41-native-publication-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: proof/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
