name: Portal fix source workspace
on:
  push:
    branches: [fix/portal-traversal-performance-20260922]
    paths: [.github/workflows/portal-fix-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          git rev-parse HEAD > /tmp/SOURCE_COMMIT
          tar --exclude=.git -czf /tmp/portal-current-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: portal-current-source
          path: |
            /tmp/portal-current-source.tar.gz
            /tmp/SOURCE_COMMIT
          retention-days: 3
