name: Unified campaign acceptance
on:
  push:
    branches: [upgrade/unified-campaign-20261007]
permissions: {contents: read, actions: read}
concurrency:
  # Every exact source gets its complete run; duplicate runs of that same
  # source can still cancel each other without truncating another revision.
  group: unified-campaign-review-${{ github.sha }}
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/verified-build.yml
    with:
      revision: ${{ github.sha }}
      record_puzzle: true
