name: Inspect the failed unified publication proof

'on':
  push:
    branches: [main]
    paths: [.github/workflows/inspect-unified-proof.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: inspect-unified-proof
  cancel-in-progress: true

env:
  PUBLICATION_RUN: '37704515629'
  PUBLICATION_HEAD: 2d574552efaed915598864710909f49e62a8dab5
  PUBLICATION_ATTEMPT: '1'
  PUBLICATION_WORKFLOW: .github/workflows/publish-unified-campaign.yml
  SOURCE_SHA: 578c31ebee7fd2ef01af5de8e673589c67e9daf0
  PROOF_ARTIFACT: '11519953728'
  PROOF_NAME: unified-publication-proof
  PROOF_SIZE: '23290861'
  PROOF_DIGEST: sha256:47e309549838a808527e1093afac6bba4eaf31fb9d8ce0bfd0dabe48379f493d

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download only the exact failed run's checksum-pinned proof
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |
            const fs=require('node:fs'), assert=require('node:assert/strict'), crypto=require('node:crypto');
            const {Readable,Transform}=require('node:stream'),{pipeline}=require('node:stream/promises');
            const {owner,repo}=context.repo;
            assert.equal(owner+'/'+repo,'amazin20/brainrot-portal');
            const runId=Number(process.env.PUBLICATION_RUN),artifactId=Number(process.env.PROOF_ARTIFACT),expectedSize=Number(process.env.PROOF_SIZE);
            for(const value of [runId,artifactId,expectedSize])assert.ok(Number.isSafeInteger(value)&&value>0);
            const run=(await github.rest.actions.getWorkflowRun({owner,repo,run_id:runId})).data;
            assert.equal(run.id,runId);
            assert.equal(run.head_sha,process.env.PUBLICATION_HEAD);
            assert.equal(run.path,process.env.PUBLICATION_WORKFLOW);
            assert.equal(run.run_attempt,Number(process.env.PUBLICATION_ATTEMPT));
            assert.equal(run.status,'completed');
            assert.equal(run.conclusion,'failure');
            const artifact=(await github.rest.actions.getArtifact({owner,repo,artifact_id:artifactId})).data;
            assert.equal(artifact.id,artifactId);
            assert.equal(artifact.name,process.env.PROOF_NAME);
            assert.equal(artifact.expired,false);
            assert.equal(artifact.workflow_run.id,runId);
            assert.equal(artifact.workflow_run.head_sha,process.env.PUBLICATION_HEAD);
            assert.equal(artifact.size_in_bytes,expectedSize);
            assert.equal(artifact.digest,process.env.PROOF_DIGEST);
            fs.mkdirSync('proof',{recursive:true});
            const response=await fetch('https://api.github.com/repos/'+owner+'/'+repo+'/actions/artifacts/'+artifactId+'/zip',{
              headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},
              signal:AbortSignal.timeout(180000)
            });
            assert.ok(response.ok,'Proof archive HTTP '+response.status);assert.ok(response.body);
            const hash=crypto.createHash('sha256');let size=0;
            const meter=new Transform({transform(bytes,encoding,done){
              size+=bytes.length;if(size>expectedSize)return done(new Error('Oversized proof archive'));
              hash.update(bytes);done(null,bytes);
            }});
            await pipeline(Readable.fromWeb(response.body),meter,fs.createWriteStream('proof-input.zip',{flags:'wx'}));
            const digest='sha256:'+hash.digest('hex');
            assert.equal(size,expectedSize);assert.equal(digest,process.env.PROOF_DIGEST);
            fs.writeFileSync('proof/input-identity.json',JSON.stringify({run,artifact,downloadedBytes:size,downloadedDigest:digest},null,2)+'\n');
      - name: Safely extract the exact report and manifest and print the failure state
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, stat, zipfile
          root=pathlib.Path('proof')
          archive_path=pathlib.Path('proof-input.zip')
          assert archive_path.stat().st_size==int(os.environ['PROOF_SIZE'])
          assert 'sha256:'+hashlib.sha256(archive_path.read_bytes()).hexdigest()==os.environ['PROOF_DIGEST']
          wanted={'prepublication-browser/report.json','manifest.json'}
          selected={}
          seen=set()
          total=0
          with zipfile.ZipFile(archive_path) as archive:
              for entry in archive.infolist():
                  name=entry.filename
                  if entry.is_dir():
                      name=name.rstrip('/')
                  assert name and not name.startswith('/') and '\\' not in name and ':' not in name
                  assert all(part not in ('','.','..') for part in name.split('/')),name
                  assert name not in seen,('Duplicate archive path',name)
                  seen.add(name)
                  kind=stat.S_IFMT(entry.external_attr>>16)
                  assert kind in (0,stat.S_IFDIR if entry.is_dir() else stat.S_IFREG),('Nonregular archive entry',name)
                  total+=entry.file_size
                  assert total<500_000_000,'Oversized expanded proof archive'
                  if name in wanted:
                      assert not entry.is_dir() and entry.file_size<8_000_000
                      data=archive.read(entry)
                      assert len(data)==entry.file_size
                      value=json.loads(data)
                      target=root/name
                      target.parent.mkdir(parents=True,exist_ok=True)
                      target.write_bytes(data)
                      selected[name]=value
          assert set(selected)==wanted,('Missing exact proof report',set(selected))
          report=selected['prepublication-browser/report.json']
          manifest=selected['manifest.json']
          source=os.environ['SOURCE_SHA']
          assert report['sourceCommit']==source
          assert report['pass'] is False,'This diagnostic is pinned to the failed browser proof'
          assert manifest['gameCommit']==manifest['interfaceCommit']==source
          assert manifest['publisherCommit']==os.environ['PUBLICATION_HEAD']
          assert manifest['publicationRun']==int(os.environ['PUBLICATION_RUN'])
          rows=report.get('ordinary',[])
          flags=['selectedThroughMap','nativeTrustedPlay','pauseRestartResumeReturnPlay','reloadAndReplay']
          summary={
              'publicationRun':int(os.environ['PUBLICATION_RUN']),
              'publisherCommit':os.environ['PUBLICATION_HEAD'],
              'sourceCommit':source,
              'pass':report['pass'],
              'error':report.get('error'),
              'stack':report.get('stack'),
              'errors':report.get('errors'),
              'failureState':report.get('failureState'),
              'matrix':report.get('matrix'),
              'ordinaryCount':len(rows),
              'ordinaryFlags':{flag:{'true':sum(row.get(flag) is True for row in rows),'other':sum(row.get(flag) is not True for row in rows)} for flag in flags},
              'activeOriginalModelsCount':len(report.get('activeOriginalModels',[])),
              'identity':report.get('identity'),
              'gallery':report.get('gallery'),
              'lastOrdinary':rows[-1] if rows else None,
              'siteFiles':len(manifest.get('siteFiles',[])),
              'preservedFiles':len(manifest.get('preservedFiles',[])),
          }
          text=json.dumps(summary,ensure_ascii=False,indent=2)+'\n'
          (root/'diagnostic.json').write_text(text)
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as output:
              output.write('### Failed publication browser proof\n\nRun '+os.environ['PUBLICATION_RUN']+'; exact source '+source+'; native rows '+str(len(rows))+'. This inspection performs no publication.\n\n```json\n'+text+'```\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-failed-proof-inspection
          path: proof/
          if-no-files-found: error
          retention-days: 14
