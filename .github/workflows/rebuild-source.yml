name: Rebuild source workspace
on:
  push:
    branches: [rebuild/open-chambers-20260922]
    paths: [.github/workflows/rebuild-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p /tmp/rebuild-source
          git rev-parse HEAD > /tmp/rebuild-source/SOURCE_COMMIT
          git archive --format=tar.gz HEAD > /tmp/rebuild-source/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: open-chambers-source
          path: /tmp/rebuild-source/
          retention-days: 2
