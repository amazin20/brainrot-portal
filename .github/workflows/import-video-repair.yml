name: Import and render video regression repair
on:
  push:
    branches: ['fix/carry-wind-shot-review']
    paths: ['.github/workflows/import-video-repair.yml']
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify and import only authorized source and regression files
        run: |
          python3 - <<'PY'
          import urllib.request,json,hashlib,zipfile,io,pathlib,stat
          u='https://api.firestorage.ai/dev/file/shares/NxI602TwrMI_/files/01a07c197a15712da3b303801c922f02/download'
          with urllib.request.urlopen(urllib.request.Request(u,method='POST'),timeout=30) as r: link=json.load(r)['downloadUrl']
          assert link.startswith('https://')
          with urllib.request.urlopen(link,timeout=30) as r: b=r.read(1000000)
          assert len(b)==108255 and hashlib.sha256(b).hexdigest()=='d225d8236d05b3941d35d810a65f491945e0c0346ff85c67bebf0ca95fb8cd77'
          allowed={'PROJECT_STATUS.md','docs/VIDEO_REPAIR_V18.md','index.html','scripts/verify-public.mjs','scripts/video-repair-browser.mjs','scripts/video-repro.mjs','src/game/AudioController.js','src/game/LabAirForces.js','src/game/LabCampaignLevels.js','src/game/LabCompanionBehavior.js','src/game/LabGame.js','src/game/LabPhysics.js','src/game/LabPlayerAnimator.js','src/game/LabPlayerAnimatorBase.js','src/game/LabPortalShots.js','src/game/LabSweep.js','src/game/LabTutorial.js','src/game/LabV8Journey.js','src/game/LabWindRoom.js','src/game/LabWorkshopCampaign.js','src/game/LabWorkshopJourney.js','src/game/LabWorkshopKit.js','tests/lab-companion-life.test.js','tests/lab-game.test.js','tests/lab-video-repairs.test.js','tests/lab-wind-room.test.js'}
          z=zipfile.ZipFile(io.BytesIO(b));assert z.testzip() is None and set(z.namelist())==allowed
          for e in z.infolist():
              assert not stat.S_ISLNK(e.external_attr>>16)
              p=pathlib.Path(e.filename);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(z.read(e))
          print('26 verified source files imported; no model or video bytes altered')
          PY
      - name: Save only the review branch
        run: |
          test "$GITHUB_REF_NAME" = 'fix/carry-wind-shot-review'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts tests docs index.html PROJECT_STATUS.md
          git commit -m 'Repair recorded grip and wall failures, physical automatic wind and travelling portal shots'
          git push origin HEAD:refs/heads/fix/carry-wind-shot-review
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm install --no-save --package-lock=false puppeteer-core@24.16.0
      - name: All source, physical routes and negative cases
        run: |
          npm run check
          node scripts/v8-package-check.mjs
          node scripts/v8-journey.mjs
          node scripts/v10-shortcuts.mjs
          node scripts/v17-audit.mjs
          node scripts/v17-recovery.mjs
          node scripts/video-repro.mjs
          npm run build -- --mode yandex --outDir dist-yandex
      - name: Actual production browser, video regressions and SDK contract
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/preview.log 2>&1 &
          python3 -m http.server 4174 --bind 127.0.0.1 --directory dist-yandex >/tmp/yandex-preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/v8-browser.mjs
          node scripts/video-repair-browser.mjs
          node scripts/v8-yandex-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-repair-first-review
          path: |
            smoke-artifacts/
            video-repair-evidence/
            qa/v8-journeys.json
            qa/v10-shortcut-audit.json
            qa/v17-adversarial.json
            qa/v17-recovery.json
            qa/video-after.json
          retention-days: 7
