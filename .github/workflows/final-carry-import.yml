name: Commit physical carry regression fix
on:
  push:
    branches: ['release/tactile-twenty-v17']
    paths: ['.github/workflows/final-carry-import.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Import the exact three-file correction
        run: |
          python3 - <<'PY'
          import urllib.request,json,hashlib,zipfile,io,pathlib,stat
          u='https://api.firestorage.ai/dev/file/shares/NxI602TwrMI_/files/01a07a5f7f2571a8aec2386cc521819a/download'
          with urllib.request.urlopen(urllib.request.Request(u,method='POST'),timeout=30) as r: link=json.load(r)['downloadUrl']
          assert link.startswith('https://')
          with urllib.request.urlopen(link,timeout=30) as r: b=r.read(1000000)
          assert len(b)==11442 and hashlib.sha256(b).hexdigest()=='be5e92ff2b188fa4c75059957bd535893f6cea9058bbddcf3012169028cdc5a1'
          z=zipfile.ZipFile(io.BytesIO(b));assert z.testzip() is None
          assert set(z.namelist())=={'src/game/LabWorkshopKit.js','tests/lab-workshop-safety.test.js','docs/RELEASE_V17.md'}
          for e in z.infolist():
              assert not stat.S_ISLNK(e.external_attr>>16)
              pathlib.Path(e.filename).write_bytes(z.read(e))
          PY
      - name: Save before final full review
        run: |
          test "$GITHUB_REF_NAME" = 'release/tactile-twenty-v17'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/LabWorkshopKit.js tests/lab-workshop-safety.test.js docs/RELEASE_V17.md
          git commit -m 'Prevent interpolated render pose from adding phantom physical platform carry'
          git push origin HEAD:refs/heads/release/tactile-twenty-v17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/lab-workshop-safety.test.js
