name: V14 open-space correction verification
on:
  push:
    branches: ['feature/open-physics-v14']
permissions:
  contents: write
concurrency:
  group: v14-review
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact reviewed source changes on isolated branch
        run: |
          test "$GITHUB_REF_NAME" = 'feature/open-physics-v14'
          if test -f maintenance/v14-open-spaces.patch; then
            echo 'bf302b9d7eba73f13044f74a765502499d2b311183cb765d0f9f46a6d794f01f  maintenance/v14-open-spaces.patch' | sha256sum -c -
            git apply --check maintenance/v14-open-spaces.patch
            git apply maintenance/v14-open-spaces.patch
            rm maintenance/v14-open-spaces.patch
          fi
      - name: Dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
      - name: Source, complete routes, failed attempts and recovery
        run: |
          npm run check
          node scripts/v8-package-check.mjs
          node scripts/v8-journey.mjs
          node scripts/v10-shortcuts.mjs
          node scripts/v13-audit.mjs
          node scripts/v14-jump-audit.mjs
          node scripts/v14-recovery.mjs
          npm run build -- --mode yandex --outDir dist-yandex
      - name: Production Chromium routes, menus and recovery
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/preview.log 2>&1 &
          python3 -m http.server 4174 --bind 127.0.0.1 --directory dist-yandex >/tmp/yandex.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/v8-browser.mjs
          node scripts/v8-yandex-browser.mjs
          node scripts/v14-browser.mjs
      - name: Save verified runtime, never alter main here
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'V14 verified: continuous portal walls, seventh exit and tenth recovery route'
            git push origin HEAD:refs/heads/feature/open-physics-v14
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v14-verification
          path: |
            smoke-artifacts/
            qa/v8-journeys.json
            qa/v10-shortcut-audit.json
            qa/v13-audit.json
            qa/v14-*.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: v14-browser
          path: dist/
          retention-days: 7
