name: Next laboratory workspace
on:
  push:
    branches: [feat/laboratory-chapter-31-33]
    paths: [.github/workflows/chapter-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f8a652d7425d17b2a3378d2c77f3d97ba3f63958
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          npm ci
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
          mkdir -p /tmp/chapter-source
          git rev-parse HEAD > /tmp/chapter-source/SOURCE_COMMIT
          git archive --format=tar.gz HEAD > /tmp/chapter-source/source.tar.gz
          tar -czf /tmp/chapter-source/dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: chapter-pinned-workspace
          path: /tmp/chapter-source/
          retention-days: 3
