name: Review isolated puzzle progression finale 50–51
'on':
  push:
    branches: [upgrade/puzzle-progression-finale-20261010]
permissions: {contents: read, actions: read}
concurrency:
  group: puzzle-progression-finale-review-${{ github.ref }}
  cancel-in-progress: true
env:
  BUILD_COMMIT: ${{ github.sha }}
  SOURCE_REVIEW_RUN_ID: ${{ github.run_id }}
  SOURCE_REVIEW_RUN_ATTEMPT: ${{ github.run_attempt }}
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: node scripts/publish-puzzle-progression-finale.mjs source
      - run: npm ci
      - name: Build and stamp the one production package used by every native review
        run: |
          npm run build
          node scripts/publish-puzzle-progression-finale.mjs stamp dist
          node scripts/publish-puzzle-progression-finale.mjs package dist
      - uses: actions/upload-artifact@v4
        with:
          name: puzzle-progression-finale-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
  cpu:
    name: cpu
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: node scripts/publish-puzzle-progression-finale.mjs source
      - name: Retain the exact accepted Pages archive before its short expiry
        env: {GITHUB_TOKEN: '${{ github.token }}'}
        run: node scripts/publish-puzzle-progression-finale.mjs retain-baseline baseline-retained
      - uses: actions/upload-artifact@v4
        with:
          name: puzzle-progression-finale-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: baseline-retained/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Complete active regressions and publication safety fixtures
        run: |
          npm ci
          mkdir -p qa/puzzle-progression-finale-cpu
          set -o pipefail
          npm test 2>&1 | tee qa/puzzle-progression-finale-cpu/active-tests.log
          node scripts/publish-puzzle-progression-finale.mjs cpu qa/puzzle-progression-finale-cpu/active-tests.log
          node scripts/test-publish-puzzle-progression-finale.mjs
          python3 scripts/test-publish-puzzle-progression-finale.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: puzzle-progression-finale-cpu-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa/puzzle-progression-finale-cpu/
          if-no-files-found: error
          retention-days: 14
  native:
    name: native (${{ matrix.level }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix: {level: [50, 51]}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: node scripts/publish-puzzle-progression-finale.mjs source
      - uses: actions/download-artifact@v4
        with:
          name: puzzle-progression-finale-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Verify the shared tested package and install the pinned native verifier
        run: |
          npm ci
          node scripts/publish-puzzle-progression-finale.mjs package dist
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          python3 -m venv "$RUNNER_TEMP/progression-python"
          "$RUNNER_TEMP/progression-python/bin/python" -m pip install --disable-pip-version-check Pillow==11.3.0
          echo "CODEX_PRIMARY_RUNTIME_PYTHON=$RUNNER_TEMP/progression-python/bin/python" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
      - name: Complete the actual native room journey and verify rendering, models and controls
        env:
          START_SERVER: '1'
          LEVEL: ${{ matrix.level }}
          OUT_DIR: qa/puzzle-progression-finale-browser-${{ matrix.level }}
        run: |
          timeout --signal=TERM --kill-after=10s 900s node scripts/qa-puzzle-progression-finale-browser.mjs
          node scripts/publish-puzzle-progression-finale.mjs bind-browser "qa/puzzle-progression-finale-browser-$LEVEL" "$LEVEL"
      - name: Record one continuous input-only journey and decode the final movie
        env:
          PAGE_URL: http://127.0.0.1:4173/?pilot=progression
          LEVEL: ${{ matrix.level }}
          CAPTURE_FPS: '4'
          CAPTURE_WIDTH: '640'
          CAPTURE_HEIGHT: '360'
          OUT_DIR: qa/puzzle-progression-finale-walkthrough-${{ matrix.level }}
        run: |
          mkdir -p "$OUT_DIR"
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4173 --strictPort >"$OUT_DIR/server.log" 2>&1 &
          progression_preview_pid=$!
          trap 'kill "$progression_preview_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          for(let attempt=0;attempt<80;attempt++){
            try {const response=await fetch('http://127.0.0.1:4173/build-info.json');assert.ok(response.ok);assert.equal((await response.json()).commit,process.env.BUILD_COMMIT);break;}
            catch(error){if(attempt===79)throw error;await new Promise(resolve=>setTimeout(resolve,250));}
          }
          JS
          timeout --signal=TERM --kill-after=10s 1500s node scripts/record-foundation-walkthrough.mjs
          node scripts/publish-puzzle-progression-finale.mjs recording "$OUT_DIR" "$LEVEL"
      - name: Preserve native evidence from this exact attempt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-progression-finale-native-${{ matrix.level }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            qa/puzzle-progression-finale-browser-${{ matrix.level }}/
            qa/puzzle-progression-finale-walkthrough-${{ matrix.level }}/*.json
            qa/puzzle-progression-finale-walkthrough-${{ matrix.level }}/*.mp4
            qa/puzzle-progression-finale-walkthrough-${{ matrix.level }}/*.jpg
            qa/puzzle-progression-finale-walkthrough-${{ matrix.level }}/server.log
          if-no-files-found: error
          retention-days: 14
  package:
    name: package
    needs: [build, cpu, native]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: node scripts/publish-puzzle-progression-finale.mjs source
      - uses: actions/download-artifact@v4
        with:
          name: puzzle-progression-finale-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: puzzle-progression-finale-cpu-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa/puzzle-progression-finale-cpu
      - uses: actions/download-artifact@v4
        with:
          pattern: puzzle-progression-finale-native-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa
          merge-multiple: true
      - name: Assemble exact current evidence and stamp the complete package inventory
        run: |
          npm ci
          node scripts/publish-puzzle-progression-finale.mjs package dist
          node scripts/publish-puzzle-progression-finale.mjs evidence dist
          node scripts/publish-puzzle-progression-finale.mjs stamp dist
      - uses: actions/upload-artifact@v4
        with:
          name: puzzle-progression-finale-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
  gate:
    name: gate
    needs: [build, cpu, native, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node scripts/publish-puzzle-progression-finale.mjs source
      - uses: actions/download-artifact@v4
        with:
          name: puzzle-progression-finale-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: puzzle-progression-finale-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: baseline-retained
      - name: Prove safe full-site assembly without publishing
        run: |
          python3 scripts/publish-puzzle-progression-finale.py prepare-baseline --zip baseline-retained/baseline.zip --output baseline-pages
          python3 scripts/publish-puzzle-progression-finale.py assemble --baseline baseline-pages --candidate dist --site site --proof proof --source "$BUILD_COMMIT" --publisher 0a22c3b1a1456cccccca3759c336ed8a22fad857 --baseline-source 8d2c01eacd86fe9235a35e7ec5f624ba62c3b29e --baseline-publisher 0a22c3b1a1456cccccca3759c336ed8a22fad857 --run "$GITHUB_RUN_ID" --baseline-run 37923054511 --review-run "$SOURCE_REVIEW_RUN_ID" --review-attempt "$SOURCE_REVIEW_RUN_ATTEMPT"
      - uses: actions/upload-artifact@v4
        with:
          name: puzzle-progression-finale-review-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: proof/
          if-no-files-found: error
          retention-days: 14
