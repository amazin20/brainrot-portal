name: P03 suspension native comparison
on:
  push:
    branches: [feature/p03-suspension]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        tag: [before, after]
    env:
      P03_TAG: ${{ matrix.tag }}
      BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify suspension and prepare exact version
        run: |
          npm ci
          node --test tests/lab-pocket-suspension.test.js
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
          if [ "$P03_TAG" = before ]; then
            mkdir -p /tmp/p03-before
            git archive 91ea2ff95107e6dcc4dc5b847795b5af0dccd50b | tar -xf - -C /tmp/p03-before
            cmp package-lock.json /tmp/p03-before/package-lock.json
            ln -s "$PWD/node_modules" /tmp/p03-before/node_modules
            (cd /tmp/p03-before && npm run build)
          else
            npm run build
          fi
      - name: Native cutaway frames and normal start image
        run: |
          command -v ffmpeg || { sudo apt-get update && sudo apt-get install -y ffmpeg; }
          if [ "$P03_TAG" = before ]; then
            directory=/tmp/p03-before/dist
            export SOURCE_COMMIT=91ea2ff95107e6dcc4dc5b847795b5af0dccd50b
          else
            directory=dist
            export SOURCE_COMMIT="$GITHUB_SHA"
          fi
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$directory" >/tmp/p03-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/p03-suspension-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p03-suspension-${{ matrix.tag }}
          path: |
            smoke-artifacts/p03/*.json
            smoke-artifacts/p03/*.mp4
            smoke-artifacts/p03/*.png
          if-no-files-found: error
          retention-days: 14
