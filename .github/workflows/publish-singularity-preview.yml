name: Publish isolated Singularity preview
on:
  push:
    branches: [feature/tower-singularity, main]
    paths: [tools/singularity-preview-release.json]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  access:
    name: Confirm Pages publishing access (probe does not deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
    outputs:
      mode: ${{ steps.config.outputs.mode }}
      candidate: ${{ steps.config.outputs.candidate }}
      base: ${{ steps.config.outputs.base }}
      proof: ${{ steps.config.outputs.proof }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: config
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const c=JSON.parse(fs.readFileSync('tools/singularity-preview-release.json'));
          assert.ok(['probe','demo','complete'].includes(c.mode));assert.match(c.sourceCommit,/^[a-f0-9]{40}$/);assert.match(c.baseCommit,/^[a-f0-9]{40}$/);
          assert.ok(Number.isSafeInteger(c.candidateRun)&&Number.isSafeInteger(c.baseRun));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`mode=${c.mode}\ncandidate=${c.candidateRun}\nbase=${c.baseRun}\nproof=${c.mode==='complete'?'singularity-evidence':'singularity-native-verification'}\n`);
          console.log(c.mode==='probe'?'Publishing access confirmed; no files will be deployed':'Prepare the pinned isolated preview');
          JS
  assemble:
    name: Preserve the existing website and add the exact new Tower
    needs: access
    if: needs.access.outputs.mode != 'probe'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check source verification and original publication provenance
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs');const c=JSON.parse(fs.readFileSync('tools/singularity-preview-release.json'));
            const {owner,repo}=context.repo;
            const run=(await github.rest.actions.getWorkflowRun({owner,repo,run_id:c.candidateRun})).data;
            if(c.mode==='complete'&&run.conclusion!=='success')throw Error('The complete recording run has not succeeded');
            const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{owner,repo,run_id:c.candidateRun,per_page:100});
            if(!jobs.some(j=>j.steps?.some(s=>s.name==='Inspect the browser rendering and verify the entire production route'&&s.conclusion==='success')))throw Error('The full native route did not pass');
            const base=(await github.rest.actions.getWorkflowRun({owner,repo,run_id:c.baseRun})).data;
            if(base.conclusion!=='success'||base.head_sha!==c.baseCommit||base.name!=='Deploy verified portal game')throw Error('Original campaign publication mismatch');
            const current=await fetch('https://amazin20.github.io/brainrot-portal/build-info.json?verify='+Date.now());
            if(!current.ok||(await current.json()).commit!==c.baseCommit)throw Error('The public root changed; refresh the pinned base instead of overwriting it');
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: ${{ needs.access.outputs.base }}
          github-token: ${{ github.token }}
          path: base-pages
      - uses: actions/download-artifact@v4
        with:
          name: singularity-browser
          run-id: ${{ needs.access.outputs.candidate }}
          github-token: ${{ github.token }}
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.access.outputs.proof }}
          run-id: ${{ needs.access.outputs.candidate }}
          github-token: ${{ github.token }}
          path: proof
      - name: Assemble with byte-for-byte preservation and optional media verification
        run: |
          command -v ffprobe >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg)
          mkdir -p site
          test "$(find base-pages -name '*.tar' | wc -l)" -eq 1
          tar -xf "$(find base-pages -name '*.tar')" -C site
          node --check scripts/assemble-singularity-preview.mjs
          node scripts/assemble-singularity-preview.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/upload-artifact@v4
        with:
          name: singularity-publication-assembly
          path: publication-proof/
          retention-days: 14
  deploy:
    name: Deploy and test the actual public demo
    needs: [access, assemble]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/deploy-pages@v4
        id: deployment
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          npm ci
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
          echo "CHROME_PATH=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: singularity-browser
          run-id: ${{ needs.access.outputs.candidate }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify the public bytes, ordinary Play, post-puzzle restart and video seeking
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --check scripts/verify-singularity-preview.mjs
          node scripts/verify-singularity-preview.mjs
      - name: Preserve public-site evidence even when a check fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: singularity-public-proof
          path: publication-proof/
          retention-days: 14
