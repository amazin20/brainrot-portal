name: Deploy verified portal game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/verified-build.yml
    with:
      revision: ${{ github.sha }}
      # Run all retained game regressions. Media is reused below, never recaptured.
      record_puzzle: false
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Download the exact package checked in this run
        uses: actions/download-artifact@v4
        with:
          name: campaign-browser
          path: dist
      - name: Find the successful Tower recording of this exact commit
        id: tower
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const runs=await github.paginate(github.rest.actions.listWorkflowRuns,{
              owner,repo,workflow_id:'tower.yml',head_sha:context.sha,status:'success',per_page:100
            });
            for(const run of runs){
              if(run.head_sha!==context.sha||run.conclusion!=='success')continue;
              const artifacts=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{
                owner,repo,run_id:run.id,per_page:100
              });
              const candidates=artifacts.filter(item=>item.name==='tower-walkthrough'&&!item.expired);
              if(candidates.length!==1)continue;
              if(candidates[0].size_in_bytes<=1000)continue;
              core.setOutput('run',String(run.id));
              core.info(`Reuse Tower artifact ${candidates[0].id} from successful run ${run.id}, commit ${context.sha}`);
              return;
            }
            core.setFailed(`No successful Tower recording for exact commit ${context.sha}. Complete tower.yml before publishing; do not launch a second recording here.`);
      - name: Download the existing complete Tower recording
        uses: actions/download-artifact@v4
        with:
          name: tower-walkthrough
          run-id: ${{ steps.tower.outputs.run }}
          github-token: ${{ github.token }}
          path: qa/walkthrough-input
      - name: Confirm the package belongs to this revision
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const info=JSON.parse(fs.readFileSync('dist/build-info.json','utf8'));
          assert.equal(info.commit,process.env.BUILD_COMMIT);
          assert.equal(info.version,'v42-tower-500');
          assert.equal(info.artVersion,'v42-tower-500');
          assert.equal(info.run,process.env.GITHUB_RUN_ID);
          assert.equal(info.levels,41);
          assert.equal(info.features.archiveRooms,33);
          assert.equal(info.features.tower.stages,500);
          assert.equal(info.features.tower.checkpoints,false);
          assert.equal(info.features.tower.minimumActiveSeconds,900);
          assert.equal(info.verified,true);
          NODE
      - name: Install media verifier
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Reuse the forty already approved videos with pinned SHA256 hashes
        run: node scripts/reuse-foundation-walkthroughs.mjs
      - name: Verify all 41 MP4s, Tower activity and original source provenance
        run: node scripts/assemble-walkthroughs.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install public-browser probe
        run: |
          npm ci
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
      - name: Verify 41 public MP4 beginning/tail ranges and final-frame gallery playback
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/verify-public-walkthroughs.mjs
      - name: Verify public revision, live model hashes and ordinary gameplay
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/verify-public.mjs
      - name: Verify the published open-chamber edition, not just the legacy menu
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          BUILD_COMMIT: ${{ github.sha }}
          RECORD: '0'
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/open-browser-review.mjs
      - name: Verify the reported horizontal portal and cold shader work on the public site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          BUILD_COMMIT: ${{ github.sha }}
          RECORD: '0'
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/portal-regression-browser.mjs
      - name: Verify the new default campaign on the published site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          BUILD_COMMIT: ${{ github.sha }}
          ROOMS: '1,30,31,35,40'
          RECORD: '0'
          ONLY_NORMAL: '1'
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/foundation-browser.mjs
      - name: Preserve evidence from the public site itself
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-site-verification
          path: |
            live-evidence/
            qa/public-walkthroughs/
            qa/open-browser/
            qa/portal-regression/
            qa/foundation-browser/
          retention-days: 14
