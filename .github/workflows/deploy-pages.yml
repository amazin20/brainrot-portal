name: Deploy verified portal game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/verified-build.yml
    with:
      revision: ${{ github.sha }}
      # The identical candidate tree already has the full reviewed video.
      # Run all twenty WebGL routes again without re-encoding their video excerpts.
      record_puzzle: false
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Download the exact package checked in this run
        uses: actions/download-artifact@v4
        with:
          name: campaign-browser
          path: dist
      - name: Confirm the package belongs to this revision
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const info=JSON.parse(fs.readFileSync('dist/build-info.json','utf8'));
          assert.equal(info.commit,process.env.BUILD_COMMIT);
          assert.equal(info.version,'v35-interlaced-campaign');
          assert.equal(info.artVersion,'v34-machined-environment');
          assert.equal(info.run,process.env.GITHUB_RUN_ID);
          assert.equal(info.levels,20);
          assert.equal(info.verified,true);
          NODE
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install public-browser probe
        run: |
          npm ci
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
      - name: Verify public revision, live model hashes and ordinary gameplay
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/verify-public.mjs
      - name: Preserve evidence from the public site itself
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-site-verification
          path: live-evidence/
          retention-days: 14
