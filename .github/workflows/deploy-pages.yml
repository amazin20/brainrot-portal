name: Deploy verified portal game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked game and browser driver
        run: |
          npm ci
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
      - name: Verify source, twenty complete routes and bounded bypass/recovery checks
        run: |
          npm run check
          node scripts/v8-package-check.mjs
          node scripts/v8-journey.mjs
          node scripts/v10-shortcuts.mjs
          node scripts/v17-audit.mjs
          node scripts/v17-recovery.mjs
          node scripts/video-repro.mjs
          npm run build -- --mode yandex --outDir dist-yandex
      - name: Verify actual production browser, video regressions, settings and advertising contract
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/preview.log 2>&1 &
          python3 -m http.server 4174 --bind 127.0.0.1 --directory dist-yandex >/tmp/yandex-preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/v8-browser.mjs
          node scripts/video-repair-browser.mjs
          node scripts/portal-shot-browser.mjs
          node scripts/v8-yandex-browser.mjs
      - name: Stamp exact tested revision
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {CAMPAIGN} from './src/game/LabCampaignLevels.js';
          if(CAMPAIGN.length!==20)throw Error('Unexpected chamber count');
          fs.writeFileSync('dist/build-info.json',JSON.stringify({commit:process.env.GITHUB_SHA,version:'v21-video-workshop',levels:CAMPAIGN.length,verified:true,repository:process.env.GITHUB_REPOSITORY,run:process.env.GITHUB_RUN_ID},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-evidence
          path: |
            smoke-artifacts/
            qa/v8-journeys.json
            qa/v10-shortcut-audit.json
            qa/v17-adversarial.json
            qa/v17-recovery.json
            qa/video-after.json
            video-repair-evidence/
            portal-shot-evidence/
          retention-days: 14
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, verify-sep8]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install public-browser probe
        run: |
          npm ci
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
      - name: Verify public revision, all live model hashes and actual playable new chamber
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/verify-public.mjs
      - name: Preserve evidence from the public site itself
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-site-verification
          path: live-evidence/
          retention-days: 14

  verify-sep8:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build the production video-repair candidate
        run: |
          npm ci
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
          npm run build
      - name: Verify rapid mouse shots, carry-jump bypass and rebuilt rooms
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/sep8-preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/sep8-browser.mjs
      - name: Preserve actual game video and input evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sep8-video-repair
          path: sep8-evidence/
          retention-days: 14
