name: Final solid model native review
on:
  push:
    branches: [fix/solid-models-20260921]
    paths: [.github/workflows/solid-final-review.yml]
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply the exact locally tested final geometry patch
        run: |
          cat > /tmp/solid-final.patch <<'PATCH'
          diff --git a/src/game/LabSolidModels.js b/src/game/LabSolidModels.js
          --- a/src/game/LabSolidModels.js
          +++ b/src/game/LabSolidModels.js
          @@ -173,11 +173,35 @@
           function buildSolarObservatory(){
            const a=new SolidAssembly('Solar observatory crown','launch');
            a.turned([[0,-5.6],[2.4,-5.6],[3,-5],[2.4,-4.4],[1.9,-4.4],[1.9,-1.1],[3.7,-.7],[4,-.1],[4,.4],[3.7,.8],[0,.8]],1);
          - a.turned([[0,.80],[3.65,.80],[3.8,1],[3.6,1.45],[2.9,1.95],[0,2.2]],2);
          + // The original hub envelope remains unchanged; a stepped receiver replaces
          + // the undifferentiated cap. Each collar and lens is a closed solid volume.
          + a.bounds(new THREE.Box3(V(-3.8,.8,-3.8),V(3.8,2.2,3.8)));
          + a.turned([[0,.80],[3.65,.80],[3.8,1],[3.70,1.25],[3.1,1.35],[0,1.35]],2,[0,0,0],Q(),false);
          + a.turned([[0,1.34],[2.90,1.34],[3.02,1.43],[3.02,1.65],[2.85,1.73],[0,1.73]],1,[0,0,0],Q(),false);
          + a.turned([[0,1.74],[2.58,1.74],[2.70,1.84],[2.62,2.04],[1.6,2.16],[0,2.20]],2,[0,0,0],Q(),false);
          + for(let i=0;i<12;i++){
          +  const t=i*Math.PI/6;
          +  a.add(new THREE.CylinderGeometry(.115,.115,.10,6),1,[Math.cos(t)*3.35,1.35,Math.sin(t)*3.35],Q(),[1,1,1],false);
          + }
            for(let i=0;i<8;i++){
          -  const t=i*Math.PI/4,shape=new THREE.Shape();shape.moveTo(2.9,-.65);shape.lineTo(4.3,-1.0);shape.bezierCurveTo(7.5,-1.55,10.9,-1.2,12,-.25);shape.lineTo(11.4,.70);shape.bezierCurveTo(8.3,1.4,5,1.35,3,.60);shape.closePath();
          -  const g=new THREE.ExtrudeGeometry(shape,{depth:.38,steps:1,bevelEnabled:true,bevelSize:.08,bevelThickness:.06,bevelSegments:2,curveSegments:10});g.rotateX(-Math.PI/2);
          -  const q=Q().setFromAxisAngle(V(0,1,0),-t);a.add(g,0,[0,0,0],q);
          +  const t=i*Math.PI/4,q=Q().setFromAxisAngle(V(0,1,0),-t);
          +  const outline=new THREE.Shape();outline.moveTo(2.9,-.65);outline.lineTo(4.3,-1.0);outline.bezierCurveTo(7.5,-1.55,10.9,-1.2,12,-.25);outline.lineTo(11.4,.70);outline.bezierCurveTo(8.3,1.4,5,1.35,3,.60);outline.closePath();
          +  const options={depth:.38,steps:1,bevelEnabled:true,bevelSize:.08,bevelThickness:.06,bevelSegments:2,curveSegments:10};
          +  // Retain the exact old closed-fin envelope, independent of its finish.
          +  const envelope=new THREE.ExtrudeGeometry(outline,options);envelope.rotateX(-Math.PI/2);envelope.applyQuaternion(q);envelope.computeBoundingBox();a.bounds(envelope.boundingBox);envelope.dispose();
          +  const fieldPoints=outline.getPoints(10).map(p=>new THREE.Vector2(7.4+(p.x-7.4)*.79,p.y*.64));
          +  const field=new THREE.Shape(fieldPoints),opening=new THREE.Path(fieldPoints.slice().reverse());opening.closePath();outline.holes.push(opening);
          +  const frame=new THREE.ExtrudeGeometry(outline,options);frame.rotateX(-Math.PI/2);a.add(frame,0,[0,0,0],q,[1,1,1],false);
          +  // The collector top is recessed 15 cm below the frame lip, not painted on
          +  // another full face. This removes the coincident-skin failure mode entirely.
          +  const plate=new THREE.ExtrudeGeometry(field,{...options,depth:.18,bevelSize:.02,bevelThickness:.02,bevelSegments:1});plate.rotateX(-Math.PI/2);a.add(plate,1,[0,.05,0],q,[1,1,1],false);
          +  for(const x of [5.25,6.7,8.15,9.6]){
          +   const p=V(x,.285,0).applyQuaternion(q);
          +   a.add(new THREE.BoxGeometry(.052,.07,1.08),2,p.toArray(),q,[1,1,1],false);
          +  }
          +  const hinge=V(3.65,.37,0).applyQuaternion(q);
          +  a.add(new RoundedBoxGeometry(.62,.35,1.05,2,.06),1,hinge.toArray(),q,[1,1,1],false);
          +  for(const z of [-.35,.35])a.add(new THREE.CylinderGeometry(.095,.095,.06,6),2,V(3.65,.57,z).applyQuaternion(q).toArray(),Q(),[1,1,1],false);
             a.beam([Math.cos(t)*2.1,-2.2,Math.sin(t)*2.1],[Math.cos(t)*8.2,-.30,Math.sin(t)*8.2],.18,1);
            }
            a.arc(13.4,.40,.48,1,[0,-.25,0],Q().setFromAxisAngle(V(1,0,0),Math.PI/2));
          diff --git a/src/game/LabBrowser3DPremium.js b/src/game/LabBrowser3DPremium.js
          --- a/src/game/LabBrowser3DPremium.js
          +++ b/src/game/LabBrowser3DPremium.js
          @@ -1,6 +1,6 @@
           import * as THREE from 'three';
           import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
          -import {ArchitecturalBatch,architecturalMaterials,clipArchitecturalRect} from './LabArchitecturalModels.js';
          +import {ArchitecturalBatch,architecturalMaterials,architecturalCassetteGeometry,clipArchitecturalRect} from './LabArchitecturalModels.js';
           import {advancedRoomPalette} from './LabAdvancedArchitecture.js';
           import {earlyRoomPalette,architecturalCeiling} from './LabEarlyArchitecture.js';
           import {getChapterVisualProfile,chapterSurfaceColor,keepsAuthoredMaterial} from './LabChapterArt.js';
          @@ -26,6 +26,8 @@
             const batch=new ArchitecturalBatch(root,materials);
             const singleSkin=level.index>=23;
             if(singleSkin){
          +    batch.geometry.dispose();
          +    batch.geometry=architecturalCassetteGeometry({corner:.006,inset:.004});
               // One closed mesh owns the visible surface. The dark folded shoulder is
               // vertex colour, not a second plane four millimetres behind the paint.
               const position=batch.geometry.attributes.position,colors=[];
          diff --git a/src/game/LabArchitecturalModels.js b/src/game/LabArchitecturalModels.js
          --- a/src/game/LabArchitecturalModels.js
          +++ b/src/game/LabArchitecturalModels.js
          @@ -5,10 +5,11 @@
           /** A folded sheet-metal cassette, with clipped corners and an actual bevel.
            * Forty-eight triangles replace the tessellated sculpted tile. Normals are
            * split at the folds; the broad face stays flat under grazing light. */
          -export function architecturalCassetteGeometry(){
          -  const points=[[-.465,-.5],[.465,-.5],[.5,-.465],[.5,.465],[.465,.5],[-.465,.5],[-.5,.465],[-.5,-.465]];
          +export function architecturalCassetteGeometry({corner=.035,inset=.012}={}){
          +  const c=.5-corner;
          +  const points=[[-c,-.5],[c,-.5],[.5,-c],[.5,c],[c,.5],[-c,.5],[-.5,c],[-.5,-c]];
             const ring=(z,inset=0)=>points.map(([x,y])=>[x*(1-inset*2),y*(1-inset*2),z]);
          -  const back=ring(-.5),shoulder=ring(.1),front=ring(.5,.012),vertices=[],uv=[];
          +  const back=ring(-.5),shoulder=ring(.1),front=ring(.5,inset),vertices=[],uv=[];
             const tri=(a,b,c)=>{for(const p of [a,b,c]){vertices.push(...p);uv.push(p[0]+.5,p[1]+.5);}};
             for(let i=0;i<8;i++){
               const j=(i+1)%8;
          PATCH
          echo 'd00cd4d8fe4b02219a0219d8c45bc8285f6e7a4aa8cdd198650f745d9c83663d  /tmp/solid-final.patch' | sha256sum -c -
          git apply --check /tmp/solid-final.patch
          git apply /tmp/solid-final.patch
          rm .github/workflows/solid-final-review.yml
      - name: Preserve final readable source and remove the one-time transfer
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/LabSolidModels.js src/game/LabBrowser3DPremium.js src/game/LabArchitecturalModels.js .github/workflows/solid-final-review.yml
          git commit -m "Finish recessed observatory collectors and tighten architectural joints without overlapping skins"
          git push origin HEAD:fix/solid-models-20260921
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  models:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUILD_COMMIT: ${{ needs.apply.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          npm ci
          npm install --no-save --package-lock=false puppeteer-core@24.16.0 gltf-validator
          node --test tests/lab-solid-models.test.js tests/lab-static-aware-sap.test.js
          npm run build
          node scripts/stamp-build.mjs v39-campaign-30
          node scripts/export-solid-models.mjs qa/solid-models
      - name: Capture exact exported assets and actual game scenes
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/solid-offline-capture.mjs
          npm run preview -- --host 127.0.0.1 --port 4173 >solid-preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node scripts/solid-preview-capture.mjs
          node --input-type=module <<'JS'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';
          const browser=await puppeteer.launch({executablePath:process.env.CHROME_PATH,headless:true,protocolTimeout:180000,args:['--no-sandbox','--disable-dev-shm-usage','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          const page=await browser.newPage();await page.setViewport({width:1440,height:900});page.setDefaultTimeout(120000);
          await page.goto('http://127.0.0.1:4173/?debug=1&level=30',{waitUntil:'networkidle2'});
          await page.waitForFunction(()=>window.__NESI_DEMO_GAME__?.state==='ready');await page.click('#play-button');
          await page.waitForFunction(()=>window.__NESI_DEMO_GAME__?.state==='playing');
          await page.evaluate(()=>{const g=window.__NESI_DEMO_GAME__;g.renderer.setAnimationLoop(null);g.cameraRig.restoreProjection?.();g.camera.position.set(25,84,36);g.camera.lookAt(-1,65.6,7);g.camera.updateMatrixWorld(true);g.render();});
          await page.screenshot({path:'smoke-artifacts/solid-models/observatory-inspection-camera.png'});
          fs.writeFileSync('smoke-artifacts/solid-models/inspection-camera.json',JSON.stringify({source:process.env.BUILD_COMMIT,kind:'actual game, separately positioned art-inspection camera; not route evidence',camera:[25,84,36],target:[-1,65.6,7]},null,2));
          await browser.close();
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solid-models-final-native-review
          path: |
            smoke-artifacts/
            qa/solid-models/
            solid-preview.log
            dist/build-info.json
          retention-days: 14
  motion:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        room: [24, 27, 28, 29, 30]
    env:
      BUILD_COMMIT: ${{ needs.apply.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          npm ci
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
          npm run build
          node scripts/stamp-build.mjs v39-campaign-30
      - name: Native route and moving mechanism excerpts with solid colliders
        env:
          NESI_FIRST: ${{ matrix.room }}
          NESI_LAST: ${{ matrix.room }}
          NESI_UI: '0'
          NESI_CAPTURE_PUZZLE: '1'
          NESI_CAPTURE_FULL: '0'
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >solid-motion.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/v8-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solid-models-final-motion-${{ matrix.room }}
          path: |
            smoke-artifacts/
            solid-motion.log
          retention-days: 14
