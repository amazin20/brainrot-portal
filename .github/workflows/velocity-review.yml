name: Reserved room30 prototype checks
# Retired speed prototypes remain internal; campaign room30 is published separately.
# It has no public mode URL; do not probe the retired standalone UI.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Retained physics and companion prototype
        run: |
          node --test tests/lab-kinetic-movement.test.js tests/lab-epic-feel.test.js tests/lab-velocity-*.test.js
          node scripts/velocity-route.mjs
