name: W00 offline development workspace
on:
  push:
    branches: [ci/w00-workspace-snapshot]
    paths: [.github/workflows/workspace-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Package tracked source and locked dependencies only
        run: |
          mkdir -p /tmp/brainrot-workspace
          git archive HEAD | tar -xf - -C /tmp/brainrot-workspace
          cp -a node_modules /tmp/brainrot-workspace/
          git rev-parse HEAD > /tmp/brainrot-workspace/SNAPSHOT_COMMIT.txt
          node -p 'JSON.stringify({node:process.version,platform:process.platform,arch:process.arch})' > /tmp/brainrot-workspace/SNAPSHOT_RUNTIME.json
          tar -czf workspace.tar.gz -C /tmp/brainrot-workspace .
          sha256sum workspace.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: offline-workspace
          path: workspace.tar.gz
          if-no-files-found: error
          retention-days: 1
