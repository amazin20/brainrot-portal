name: Publish the exact accepted Expedition campaign
on:
  push:
    branches: [main]
    paths: [tools/expedition-release.json]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pages
  cancel-in-progress: false
env:
  RELEASE_CONFIG: tools/expedition-release.json
jobs:
  validate:
    name: Verify all nineteen frozen source gates and exact archives
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      candidate: ${{ steps.pins.outputs.candidate }}
      source: ${{ steps.pins.outputs.source }}
      levels: ${{ steps.pins.outputs.levels }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Test publication rejection and preservation contracts
        run: node --test tests/lab-expedition-publication.test.js
      - name: Validate all nineteen jobs and download digest-pinned artifacts
        id: pins
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs');const path=require('node:path');const crypto=require('node:crypto');
            const h=await import(path.join(process.env.GITHUB_WORKSPACE,'scripts/lib/expedition-proof.mjs'));
            const c=h.assertPublishableExpedition(h.assertExpeditionConfig(JSON.parse(fs.readFileSync(process.env.RELEASE_CONFIG)),JSON.parse(fs.readFileSync('tools/singularity-upgrade-release.json'))));
            const {owner,repo}=context.repo;
            const candidateRun=(await github.rest.actions.getWorkflowRun({owner,repo,run_id:c.candidateRun})).data;
            const candidateJobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{owner,repo,run_id:c.candidateRun,per_page:100});
            h.assertExpeditionJobs(candidateRun,candidateJobs,c);
            const candidateArtifacts=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{owner,repo,run_id:c.candidateRun,per_page:100});
            const accepted=h.assertExpeditionArtifacts(candidateArtifacts,c);
            const previousRun=(await github.rest.actions.getWorkflowRun({owner,repo,run_id:c.previousPublicationRun})).data;
            if(previousRun.conclusion!=='success'||previousRun.status!=='completed'||previousRun.head_branch!=='main'||previousRun.path!=='.github/workflows/publish-singularity-upgrade.yml')throw Error('Pinned previous publication must be successful');
            const previousArtifacts=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{owner,repo,run_id:c.previousPublicationRun,per_page:100});
            const base=previousArtifacts.filter(a=>a.id===c.previousArtifact.id);
            if(base.length!==1||base[0].name!==c.previousArtifact.name||base[0].digest!==c.previousArtifact.digest||base[0].expired)throw Error('Pinned previous complete Pages artifact unavailable');
            const response=await fetch('https://amazin20.github.io/brainrot-portal/build-info.json?expedition='+Date.now(),{cache:'no-store'});
            if(!response.ok||(await response.json()).commit!==c.previousSourceCommit)throw Error('Public source changed; refresh the previous publication pin');
            fs.mkdirSync('release-input/archives',{recursive:true});
            for(const artifact of [...accepted,base[0]]){
              const response=await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/artifacts/${artifact.id}/zip`,{headers:{Authorization:`Bearer ${process.env.GITHUB_TOKEN}`,Accept:'application/vnd.github+json'}});
              if(!response.ok)throw Error(`Artifact ${artifact.id}: HTTP${response.status}`);
              const bytes=Buffer.from(await response.arrayBuffer());const digest='sha256:'+crypto.createHash('sha256').update(bytes).digest('hex');
              if(digest!==artifact.digest)throw Error('Artifact ZIP digest mismatch: '+artifact.name);
              fs.writeFileSync(path.join('release-input/archives',artifact.name+'.zip'),bytes);
            }
            fs.writeFileSync('release-input/github-proof.json',JSON.stringify({candidateRun,candidateJobs,candidateArtifacts,previousRun,previousArtifacts},null,2)+'\n');
            core.setOutput('candidate',String(c.candidateRun));
            core.setOutput('source',c.sourceCommit);
            core.setOutput('levels',JSON.stringify(h.expeditionSupplementalRecordingLevels(c)));
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: expedition-publication-inputs
          path: release-input
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: expedition-capture-input
          path: release-input/archives/expedition-production.zip
          retention-days: 30
  supplemental:
    name: Continuous supplemental walkthrough (${{ matrix.level }})
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        level: ${{ fromJSON(needs.validate.outputs.levels) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source }}
          path: game-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Install capture dependencies without changing the source
        working-directory: game-source
        run: |
          npm ci
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg)
          echo "CHROME_PATH=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: expedition-capture-input
          path: capture-input
      - name: Capture room ${{ matrix.level }} with the unchanged source recorder
        env:
          LEVEL: ${{ matrix.level }}
          GAME_SOURCE_DIR: game-source
          CANDIDATE_ARCHIVE: capture-input/expedition-production.zip
          OUT_DIR: supplemental-output
        run: node scripts/capture-expedition-supplement.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: expedition-supplemental-walkthrough-${{ matrix.level }}
          path: supplemental-output
          if-no-files-found: error
          retention-days: 30
  assemble:
    name: Validate all55 native recordings and assemble without rebuilding
    needs: [validate, supplemental]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      candidate: ${{ needs.validate.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/download-artifact@v4
        with:
          name: expedition-publication-inputs
          path: release-input
      - name: Bind all38 successful native captures to this publication run
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs');const path=require('node:path');const crypto=require('node:crypto');
            const h=await import(path.join(process.env.GITHUB_WORKSPACE,'scripts/lib/expedition-proof.mjs'));
            const c=h.assertPublishableExpedition(JSON.parse(fs.readFileSync(process.env.RELEASE_CONFIG)));
            const {owner,repo}=context.repo;const run_id=context.runId;
            const publicationRun=(await github.rest.actions.getWorkflowRun({owner,repo,run_id})).data;
            const publicationJobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{owner,repo,run_id,per_page:100});
            const publicationArtifacts=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{owner,repo,run_id,per_page:100});
            const supplemental=h.assertSupplementalPublicationProof({publicationRun,publicationJobs,publicationArtifacts},c,{publicationRun:run_id,controllerSHA:context.sha});
            for(const artifact of supplemental.artifactManifest){
              const response=await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/artifacts/${artifact.id}/zip`,{headers:{Authorization:`Bearer ${process.env.GITHUB_TOKEN}`,Accept:'application/vnd.github+json'}});
              if(!response.ok)throw Error(`Supplemental artifact ${artifact.id}: HTTP${response.status}`);
              const bytes=Buffer.from(await response.arrayBuffer());const digest='sha256:'+crypto.createHash('sha256').update(bytes).digest('hex');
              if(digest!==artifact.digest)throw Error('Supplemental ZIP digest mismatch: '+artifact.name);
              fs.writeFileSync(path.join('release-input/archives',artifact.name+'.zip'),bytes);
            }
            const proof=JSON.parse(fs.readFileSync('release-input/github-proof.json'));Object.assign(proof,{publicationRun,publicationJobs,publicationArtifacts});
            fs.writeFileSync('release-input/github-proof.json',JSON.stringify(proof,null,2)+'\n');
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Safely extract exact artifact files and the preserved publication
        run: |
          python3 - <<'PY'
          import pathlib,shutil,tarfile,zipfile
          root=pathlib.Path('release-input')
          def safe(name):
              assert not name.startswith('/') and '\\' not in name and all(p not in ('','..','.') for p in name.split('/')),name
              return name
          for archive in (root/'archives').glob('*.zip'):
              target=root/archive.stem;target.mkdir()
              seen=set()
              with zipfile.ZipFile(archive) as z:
                  for entry in z.infolist():
                      if entry.is_dir():continue
                      name=safe(entry.filename);assert name not in seen;seen.add(name)
                      assert (entry.external_attr>>16)&0o170000 != 0o120000
                      filename=target/name;filename.parent.mkdir(parents=True,exist_ok=True)
                      with z.open(entry) as source,filename.open('wb') as output:shutil.copyfileobj(source,output)
          site=pathlib.Path('site');site.mkdir()
          with tarfile.open(root/'github-pages/artifact.tar') as tar:
              seen=set()
              for entry in tar:
                  name=entry.name
                  while name.startswith('./'):name=name[2:]
                  if name in ('','.'):continue
                  name=safe(name);assert entry.isfile() or entry.isdir()
                  if entry.isdir():continue
                  assert name not in seen;seen.add(name)
                  filename=site/name;filename.parent.mkdir(parents=True,exist_ok=True)
                  with tar.extractfile(entry) as source,filename.open('wb') as output:shutil.copyfileobj(source,output)
          PY
      - name: Verify exact files, every recording and preservation before promotion
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg)
          node scripts/assemble-expedition.mjs
          node -e "const p=require('./publication-proof/expedition-release.json');if(!p.publishable||!p.acceptance.automated)process.exit(1)"
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expedition-publication-assembly
          path: publication-proof
          retention-days: 30
  deploy:
    name: Publish and verify the actual primary campaign and permalink
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        name: Recheck the public source immediately before deployment
        with:
          script: |
            const fs=require('node:fs');const c=JSON.parse(fs.readFileSync(process.env.RELEASE_CONFIG));
            const h=await import(process.env.GITHUB_WORKSPACE+'/scripts/lib/expedition-proof.mjs');h.assertPublishableExpedition(c);
            const response=await fetch('https://amazin20.github.io/brainrot-portal/build-info.json?expedition='+Date.now(),{cache:'no-store'});
            if(!response.ok||(await response.json()).commit!==c.previousSourceCommit)throw Error('The public root changed before deployment');
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
      - uses: actions/setup-node@v4
        with: {node-version: 22,cache: npm}
      - run: |
          npm ci
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
          command -v ffprobe >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg)
          echo "CHROME_PATH=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: expedition-production
          run-id: ${{ needs.assemble.outputs.candidate }}
          github-token: ${{ github.token }}
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: expedition-publication-assembly
          path: publication-input
      - name: Verify public bytes, all retained and new media, native Play and reload
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          CANDIDATE_DIR: candidate
          LOCAL_RELEASE: publication-input/expedition-release.json
        run: node scripts/verify-expedition-public.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expedition-public-verification
          path: publication-proof
          retention-days: 30
