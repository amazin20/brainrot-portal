        RECORD_PUZZLE: ${{ inputs.record_puzzle }}
      run: 'node --input-type=module <<''JS''

        import fs from ''node:fs'';import path from ''node:path'';import assert from ''node:assert/strict'';

        import {verifyReleasePackage,verifyReleaseMetadata,sha256} from ''./scripts/lib/release-manifest.mjs'';

        import {FOUNDATION_INDICES} from ''./src/game/LabFoundationEdition.js'';

        const needs=JSON.parse(process.env.NEEDS_JSON);

        for(const [name,job] of Object.entries(needs))assert.equal(job.result,name===''recording''&&process.env.RECORD_PUZZLE===''false''?''skipped'':''success'',`Required ${name}: ${job.result}`);

        const infoBytes=fs.readFileSync(''dist/build-info.json''),info=JSON.parse(infoBytes);assert.equal(info.commit,process.env.BUILD_COMMIT);verifyReleasePackage(info,''dist'');verifyReleaseMetadata(info,{directory:''dist'',commit:process.env.BUILD_COMMIT});

        const platformManifestBytes=fs.readFileSync(''qa/accepted-platform/artifacts/yandex-release-manifest.json''),platform=JSON.parse(platformManifestBytes),zip=fs.readFileSync(''qa/accepted-platform/artifacts/brainrot-portal-yandex.zip'');

        assert.equal(platform.commit,info.commit);assert.equal(platform.sourceInputsSha256,info.sourceInputsSha256);assert.deepEqual(platform.rooms,info.rooms);assert.equal(platform.platformArchive.bytes,zip.length);assert.equal(platform.platformArchive.sha256,sha256(zip));

        const findReports=directory=>fs.readdirSync(directory,{withFileTypes:true}).flatMap(entry=>{const file=path.join(directory,entry.name);return entry.isDirectory()?findReports(file):entry.name===''report.json''?[file]:[];});

        const reports=findReports(''qa/current-webgl'').map(file=>JSON.parse(fs.readFileSync(file)));assert.equal(reports.length,7);

        const rows=reports.flatMap(report=>{assert.equal(report.pass,true);assert.equal(report.capturePass,true);return report.rows;});

        assert.deepEqual(rows.map(row=>row.level).sort((a,b)=>a-b),FOUNDATION_INDICES.map(index=>index+1));

        for(const row of rows){assert.equal(row.pass,true);assert.equal(row.route.pass,true);assert.equal(row.route.state,''won'');assert.equal(row.capturePass,true);assert.equal(row.route.sameCompanion,true);}

        const tower=rows.find(row=>row.level===41);assert.equal(tower.route.milestones.length,24);assert.equal(tower.routeProgress.length,24);

        assert.deepEqual(tower.routeProgress.map(({wallSeconds,observedState,...mark})=>mark),tower.route.milestones);

        for(const mark of tower.routeProgress)assert.deepEqual(mark.observedState,{state:mark.state,player:mark.player,cargo:mark.cargo,solvedIds:mark.solved});

        const evidence={buildInfoSha256:sha256(infoBytes),sourceInputsSha256:info.sourceInputsSha256,sourceInputFiles:info.sourceInputFiles,roomDefinitionsSha256:sha256(JSON.stringify(info.rooms)),platformManifestSha256:sha256(platformManifestBytes),platformArchive:platform.platformArchive,pass:true,scope:''Exact-package automated technical acceptance; human/device/live-platform claims remain separate'',commit:info.commit,version:info.version,packageFilesSha256:info.packageFilesSha256,levels:rows.length,checks:needs,recordingRequested:process.env.RECORD_PUZZLE===''true''};

        fs.mkdirSync(''qa/acceptance'',{recursive:true});fs.writeFileSync(''qa/acceptance/technical-ci.json'',JSON.stringify(evidence,null,2)+''\n'');

        JS'
