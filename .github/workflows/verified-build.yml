name: Verified campaign build
on:
  workflow_call:
    inputs:
      revision:
        description: Exact PR head or publication commit SHA
        required: true
        type: string
      record_puzzle:
        description: Record native movement in rooms12–20; all thirty-three ordinary routes always run
        required: false
        default: true
        type: boolean
permissions:
  contents: read
env:
  BUILD_COMMIT: ${{ inputs.revision }}
jobs:
  source:
    name: Source tests and deployable package
    runs-on: ubuntu-latest
    # The retained 15-room suite took 14m37s locally before this expansion.
    # Keep every test and allow build/install overhead plus the new routes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test source and verify the production asset package
        run: |
          npm run check
          node scripts/v8-package-check.mjs
          node scripts/stamp-build.mjs v40-laboratory-33
      - name: Preserve the exact deployable package
        uses: actions/upload-artifact@v4
        with:
          name: campaign-browser
          path: dist/
          if-no-files-found: error
          retention-days: 14

  physics:
    name: All thirty-three routes, bypass checks and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify ordinary routes and physical regressions
        run: |
          node scripts/v8-journey.mjs
          node scripts/v10-shortcuts.mjs
          node scripts/v17-audit.mjs
          node scripts/video-repro.mjs
      - name: Preserve physical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-physics
          path: |
            qa/v8-journeys.json
            qa/v10-shortcut-audit.json
            qa/v17-adversarial.json
            qa/video-after.json
          retention-days: 14

  browser:
    name: WebGL rooms ${{ matrix.first }}–${{ matrix.last }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {first: 1, last: 5, ui: '1'}
          - {first: 6, last: 11, ui: '0'}
          - {first: 12, last: 12, ui: '0'}
          - {first: 13, last: 13, ui: '0'}
          - {first: 14, last: 14, ui: '0'}
          - {first: 15, last: 15, ui: '0'}
          - {first: 16, last: 16, ui: '0'}
          - {first: 17, last: 17, ui: '0'}
          - {first: 18, last: 18, ui: '0'}
          - {first: 19, last: 19, ui: '0'}
          - {first: 20, last: 20, ui: '0'}
          - {first: 21, last: 21, ui: '0'}
          - {first: 22, last: 22, ui: '0'}
          - {first: 23, last: 23, ui: '0'}
          - {first: 24, last: 24, ui: '0'}
          - {first: 25, last: 25, ui: '0'}
          - {first: 26, last: 26, ui: '0'}
          - {first: 27, last: 27, ui: '0'}
          - {first: 28, last: 28, ui: '0'}
          - {first: 29, last: 29, ui: '0'}
          - {first: 30, last: 30, ui: '0'}
          - {first: 31, last: 33, ui: '0'}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build the same production revision
        run: |
          npm ci
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
          npm run build
          node scripts/stamp-build.mjs v40-laboratory-33
      - name: Verify ordinary routes in actual WebGL
        env:
          NESI_FIRST: ${{ matrix.first }}
          NESI_LAST: ${{ matrix.last }}
          NESI_UI: ${{ matrix.ui }}
          NESI_CAPTURE_PUZZLE: ${{ inputs.record_puzzle && matrix.first >= 12 && matrix.first <= 21 && '1' || '0' }}
          # New room motion review runs separately in campaign-30-review.
          NESI_CAPTURE_FULL: '0'
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >campaign-preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/v8-browser.mjs
      - name: Preserve rendered route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-webgl-${{ matrix.first }}-${{ matrix.last }}
          path: |
            smoke-artifacts/
            campaign-preview.log
          retention-days: 14

  input:
    name: Trusted mouse input and portal-edge regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build the same production revision
        run: |
          npm ci
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
          npm run build
          node scripts/stamp-build.mjs v40-laboratory-33
      - name: Verify actual mouse shots and ordinary floor/wall traversal
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >input-preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/portal-shot-browser.mjs
          node scripts/portal-edge-browser.mjs
          node scripts/flight-audio-browser.mjs
      - name: Preserve input evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-input
          path: |
            portal-shot-evidence/
            portal-edge-evidence/
            flight-audio-evidence/
            input-preview.log
          retention-days: 14

  sdk-regression:
    name: Carry/wind video regressions and Yandex SDK contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build browser and Yandex packages from the same revision
        run: |
          npm ci
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
          npm run build
          node scripts/stamp-build.mjs v40-laboratory-33
          npm run build -- --mode yandex --outDir dist-yandex
          node scripts/stamp-build.mjs v40-laboratory-33 dist-yandex
      - name: Verify physical video regressions and advertising contract
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >sdk-preview.log 2>&1 &
          python3 -m http.server 4174 --bind 127.0.0.1 --directory dist-yandex >yandex-preview.log 2>&1 &
          for port in 4173 4174; do
            for i in {1..30}; do curl -fsS "http://127.0.0.1:$port/" >/dev/null && break; sleep 1; done
            curl -fsS "http://127.0.0.1:$port/" >/dev/null
          done
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/video-repair-browser.mjs
          node scripts/v8-yandex-browser.mjs
      - name: Preserve rendered regressions and SDK evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-sdk-regression
          path: |
            video-repair-evidence/
            smoke-artifacts/
            sdk-preview.log
            yandex-preview.log
          retention-days: 14
      - name: Preserve Yandex draft (contract tested, not live ads)
        uses: actions/upload-artifact@v4
        with:
          name: campaign-yandex-draft
          path: dist-yandex/
          if-no-files-found: error
          retention-days: 14

  open-chambers:
    name: Rebuilt open chamber ${{ matrix.room }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        room: [24, 28, 30]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build the exact candidate, with unchanged original assets
        run: |
          npm ci
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
          npm run build
          node scripts/stamp-build.mjs v40-laboratory-33
      - name: Verify the distinct three-room edition through the real HTTP UI
        env:
          ROOM: ${{ matrix.room }}
          RECORD: '0'
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >open-preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/open-browser-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: open-chambers-${{ matrix.room }}
          path: |
            qa/open-browser/
            open-preview.log
          retention-days: 14

  research:
    name: Research room ${{ matrix.room }} with alternative and recovery routes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        room: [31, 32, 33]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          npm ci
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
          npm run build
          node scripts/stamp-build.mjs v40-laboratory-33
      - name: Ordinary solution and alternative exploration in native WebGL
        env:
          ROOMS: ${{ matrix.room }}
          RECORD: ${{ inputs.record_puzzle && '1' || '0' }}
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >research-preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/research-browser.mjs
          RECORD=0 ALTERNATE=1 OUT_DIR=qa/research-alternative node scripts/research-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-chapter-${{ matrix.room }}
          path: |
            qa/research-browser/
            qa/research-alternative/
            research-preview.log
          retention-days: 14

  foundation:
    name: New campaign room ${{ matrix.room }} and exploratory return
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        room: [1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          npm ci
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
          npm run build
          node scripts/stamp-build.mjs v40-laboratory-33
      - name: Default public entry, ordinary and alternative inputs, saved progress and next button
        env:
          ROOMS: ${{ matrix.room }}
          RECORD: ${{ inputs.record_puzzle && '1' || '0' }}
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >foundation-preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/foundation-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-chapter-${{ matrix.room }}
          path: |
            qa/foundation-browser/
            foundation-preview.log
          retention-days: 14
