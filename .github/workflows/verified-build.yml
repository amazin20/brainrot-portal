  resource-cycle:
    runs-on: ubuntu-latest
    # The 110 real room starts and context restore completed just before the
    # previous 35-minute job limit; keep time for browser cleanup and evidence.
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.revision }}
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - run: npm ci
    - name: Install browser harness, without changing source or lockfile
      run: 'npm install --no-save --package-lock=false puppeteer-core@24.16.0

