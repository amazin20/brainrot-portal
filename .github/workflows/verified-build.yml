        name: yandex-moderation-candidate
        path: dist-yandex
    - name: Verify downloaded accepted-candidate bytes and source identity
      env:
        PACKAGE_DIRS: dist,dist-yandex
      run: "node --input-type=module <<'JS'\nimport assert from 'node:assert/strict';\nimport fs from 'node:fs';\nimport {verifyReleasePackage,buildSourceInputs,sha256} from './scripts/lib/release-manifest.mjs';\n\
        import {RELEASE_VERSION} from './src/game/ReleaseIdentity.js';\nfor (const directory of process.env.PACKAGE_DIRS.split(',')) {\n  const info=JSON.parse(fs.readFileSync(directory+'/build-info.json'));\n\
        \  assert.equal(info.commit,process.env.BUILD_COMMIT);\n  assert.equal(info.version,RELEASE_VERSION);\n  assert.equal(info.verified,false,'Stamp remains a candidate until independent acceptance');\n\
        \  assert.equal(info.sourceInputsSha256,sha256(JSON.stringify(buildSourceInputs())));\n  verifyReleasePackage(info,directory);\n}\nJS"
    - name: Verify shared carry/wind and nested upload SDK contract
      env:
        PAGE_URL: http://127.0.0.1:4173/
      run: 'mkdir -p qa

        node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4173 --strictPort > qa/preview.log 2>&1 &

        preview_pid=$!; trap ''kill "$preview_pid" || true'' EXIT

        for i in $(seq 1 80); do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break; sleep .25; done

        curl --fail --silent http://127.0.0.1:4173/ >/dev/null

        export CHROME_PATH="$(command -v google-chrome || command -v chromium)"

        node scripts/video-repair-browser.mjs

        node scripts/check-yandex-platform.mjs > qa/yandex-platform.json

        node scripts/v8-yandex-browser.mjs'
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: campaign-sdk-regression
        path: 'video-repair-evidence/

          smoke-artifacts/

          qa/yandex-platform.json

          qa/preview.log'
        if-no-files-found: error
        retention-days: 14
    needs: package
    name: Carry/wind and exact Yandex SDK UI contract
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.revision }}
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - run: npm ci
    - name: Install browser harness, without changing source or lockfile
      run: 'npm install --no-save --package-lock=false puppeteer-core@24.16.0

        python3 -m pip install --user Pillow'
    - uses: actions/download-artifact@v4
      with:
