      if: always()
      run: node scripts/publish-campaign-v55.mjs wrap-capture entry
    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: campaign-v55-public-entry-${{ github.run_id }}-${{ github.run_attempt }}
        path: proof/public-entry
        retention-days: 10
        if-no-files-found: error
  verify:
    needs:
    - deploy
    - native
    - presentation
    - entry
    if: ${{ always() && !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        ref: ba5c86fd07facd9613f5e6e8efb9709bd2ef9e89
        path: source
        fetch-depth: 0
