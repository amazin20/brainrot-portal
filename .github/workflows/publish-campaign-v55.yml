      run: |
        python3 - <<'CHECK'
        import pathlib, shutil
        src=pathlib.Path("proof/review-artifacts/campaign-polish-dist")
        dst=pathlib.Path("source/dist")
        assert src.is_dir() and not dst.exists()
        assert len([p for p in src.rglob("*") if p.is_file()]) == 80
        shutil.copytree(src, dst)
        for p in src.rglob("*"):
         if p.is_file(): assert p.read_bytes() == (dst/p.relative_to(src)).read_bytes()
        CHECK
    - name: Authenticate the actual bare-entry producer
      run: node scripts/publish-campaign-v55.mjs capture-origin entry
    - name: Verify ordinary bare launch and historical-save preservation
      run: |
        source "$GITHUB_WORKSPACE/proof/public-entry/env.sh"
        export SOURCE_DIR="$GITHUB_WORKSPACE/source"
        export PUBLIC_BROWSER_OBSERVATIONS="$GITHUB_WORKSPACE/proof/public-entry/browser-entry.json"
        PAGE_URL="$PUBLIC_CAMPAIGN_URL" OUT_DIR="$GITHUB_WORKSPACE/proof/public-entry/payload" node --import "$GITHUB_WORKSPACE/scripts/observe-campaign-v55-browser.mjs" scripts/qa-campaign-v55-public-entry.mjs
