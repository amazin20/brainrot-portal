name: Publish one isolated puzzle pilot
'on':
  push:
    branches: [upgrade/puzzle-pilot-20261008]
permissions:
  contents: read
  actions: read
  deployments: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
env:
  BASELINE_RUN: '37744513446'
  BASELINE_PUBLISHER: 39d5311d2620a632bb65194921de53add238c74d
  BASELINE_SOURCE: 8d2c01eacd86fe9235a35e7ec5f624ba62c3b29e
  PUBLIC_BASE: https://amazin20.github.io/brainrot-portal/
jobs:
  pilot:
    name: Verify one room, preserve the whole accepted site and publish its isolated URL
    if: github.repository == 'amazin20/brainrot-portal' && github.ref == 'refs/heads/upgrade/puzzle-pilot-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}puzzle-pilot/?edition=foundation&level=43&pilot=43
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 30
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - name: Refuse a stale source, a changed public game or a later Pages deployment
        env: {GITHUB_TOKEN: '${{ github.token }}'}
        run: node scripts/publish-puzzle-pilot43.mjs guard prepare
      - name: Require the exact accepted source as the pilot ancestor
        run: git merge-base --is-ancestor "$BASELINE_SOURCE" "$GITHUB_SHA"
      - name: Test the retained source and build the exact opt-in candidate
        env: {BUILD_COMMIT: '${{ github.sha }}'}
        run: |
          npm ci
          npm test
          npm run build
          node scripts/publish-puzzle-pilot43.mjs stamp dist
      - name: Install only the native browser verifier
        run: |
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          python3 -m venv "$RUNNER_TEMP/pilot43-python"
          "$RUNNER_TEMP/pilot43-python/bin/python" -m pip install --disable-pip-version-check Pillow==11.3.0
          echo "CODEX_PRIMARY_RUNTIME_PYTHON=$RUNNER_TEMP/pilot43-python/bin/python" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
      - name: Verify real rendering, input, pilot gameplay and retained opt-in separation
        env:
          START_SERVER: '1'
          BUILD_COMMIT: ${{ github.sha }}
          OUT_DIR: qa/puzzle-pilot43-browser
        run: timeout --signal=TERM --kill-after=10s 900s node scripts/qa-puzzle-pilot43-browser.mjs
      - name: Record the complete exact pilot route with no idle padding or camera staging
        env:
          PAGE_URL: http://127.0.0.1:4173/?pilot=43
          LEVEL: '43'
          CAPTURE_FPS: '4'
          CAPTURE_WIDTH: '640'
          CAPTURE_HEIGHT: '360'
          OUT_DIR: qa/puzzle-pilot43-walkthrough
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p qa/puzzle-pilot43-walkthrough
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4173 --strictPort >qa/puzzle-pilot43-walkthrough/server.log 2>&1 &
          pilot_preview_pid=$!
          trap 'kill "$pilot_preview_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          for(let attempt=0;attempt<80;attempt++){
            try {const response=await fetch('http://127.0.0.1:4173/build-info.json');assert.ok(response.ok);break;}
            catch(error){if(attempt===79)throw error;await new Promise(resolve=>setTimeout(resolve,250));}
          }
          JS
          timeout --signal=TERM --kill-after=10s 1500s node scripts/record-foundation-walkthrough.mjs
      - name: Attach the exact native screenshots and movie, then stamp the final complete package inventory
        env: {BUILD_COMMIT: '${{ github.sha }}'}
        run: |
          node scripts/publish-puzzle-pilot43.mjs evidence dist
          node scripts/publish-puzzle-pilot43.mjs stamp dist
      - name: Save the exact tested pilot package
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-pilot43-production
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: ${{ env.BASELINE_RUN }}
          github-token: ${{ github.token }}
          path: baseline-pages
      - name: Restore the accepted archive safely and preserve every old file hash
        run: |
          python3 scripts/publish-puzzle-pilot43.py assemble --baseline baseline-pages --candidate dist --site site --proof proof --source "$GITHUB_SHA" --baseline-source "$BASELINE_SOURCE" --baseline-publisher "$BASELINE_PUBLISHER" --run "$GITHUB_RUN_ID" --baseline-run "$BASELINE_RUN"
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - name: Check every previously published byte immediately before deployment
        run: python3 scripts/publish-puzzle-pilot43.py verify --base "$PUBLIC_BASE" --manifest proof/baseline-manifest.json --output proof/predeploy-public-bytes.json
      - uses: actions/configure-pages@v5
      - name: Recheck current publisher, latest Pages deployment and exact source at the final gate
        env: {GITHUB_TOKEN: '${{ github.token }}'}
        run: node scripts/publish-puzzle-pilot43.mjs guard deploy
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify the unchanged game, all original recordings and every new pilot file on the actual site
        run: python3 scripts/publish-puzzle-pilot43.py verify --base "$PUBLIC_BASE" --manifest proof/manifest.json --output proof/public-bytes.json
      - name: Verify the actual public pilot with the same native browser input
        env:
          PAGE_URL: https://amazin20.github.io/brainrot-portal/puzzle-pilot/
          BUILD_COMMIT: ${{ github.sha }}
          OUT_DIR: qa/puzzle-pilot43-public
        run: timeout --signal=TERM --kill-after=10s 900s node scripts/qa-puzzle-pilot43-browser.mjs
      - name: Preserve publication, native rendering and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-pilot43-proof
          path: |
            proof/
            qa/puzzle-pilot43-browser/
            qa/puzzle-pilot43-public/
            qa/puzzle-pilot43-walkthrough/*.json
            qa/puzzle-pilot43-walkthrough/*.mp4
            qa/puzzle-pilot43-walkthrough/*.jpg
            qa/puzzle-pilot43-walkthrough/server.log
          if-no-files-found: error
          retention-days: 30
