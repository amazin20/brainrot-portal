name: One-room visual review
on:
  push:
    branches: ['polish/one-readable-room']
    paths: ['src/**', 'scripts/room-polish-browser.mjs', 'tests/lab-wind-room.test.js', '.github/workflows/room-polish-review.yml']
permissions:
  contents: read
concurrency:
  group: single-room-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm install --no-save --package-lock=false puppeteer-core@24.16.0
      - run: npm run build
      - name: Render actual existing room and complete its route
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/room-polish-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: single-room-review
          path: room-evidence/
          retention-days: 7
