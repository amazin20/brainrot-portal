name: Room21 R2 dependency review
on:
  push:
    branches: [feature/room21-r2-dependencies]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check redesigned room and build with the locked game dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          mkdir -p smoke-artifacts/room21-r2
          node --test tests/lab-room21.test.js tests/lab-room21-r2.test.js | tee smoke-artifacts/room21-r2/tests.txt
          R2_AIR_REPORT=smoke-artifacts/room21-r2/air-shortcuts.json node scripts/r2-air-shortcuts.mjs
          npm run build
          node scripts/v8-package-check.mjs
      - name: Review the actual browser without publishing the unaccepted room
        run: |
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/room21-r2.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/r2-browser-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: room21-r2-review
          path: smoke-artifacts/room21-r2/
          if-no-files-found: error
          retention-days: 14
