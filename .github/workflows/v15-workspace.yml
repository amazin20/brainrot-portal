name: V15 development workspace
on:
  push:
    branches: ['feature/tactile-fifteen-v15']
    paths: ['.github/workflows/v15-workspace.yml']
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Offline model and browser tooling
        run: npm install --no-save --package-lock=false puppeteer-core@24.16.0 @gltf-transform/core@4.2.1 @gltf-transform/extensions@4.2.1 @gltf-transform/functions@4.2.1 draco3dgltf@1.5.7 sharp@0.34.3
      - name: Package current source, model fixtures and dependencies without credentials
        run: tar --exclude='./.git' --exclude='./dist' --exclude='./qa' --exclude='./smoke-artifacts' -czf /tmp/nesi-v15-workspace.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: v15-workspace
          path: /tmp/nesi-v15-workspace.tgz
          retention-days: 1
