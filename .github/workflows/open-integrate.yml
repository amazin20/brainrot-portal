name: Open chamber integration and native review
on:
  push:
    branches: [rebuild/open-chambers-20260922]
    paths: [.github/workflows/open-integrate.yml]
permissions:
  contents: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply source changes only; workflow changes use the authorized connector
        run: |
          echo '584500ef66e1a5551854b1dd8aec9693709f3696d7240ac46ac91657d4be3dbd  .rebuild/open-integration.patch' | sha256sum -c -
          git apply --check --unidiff-zero --exclude='.github/workflows/*' .rebuild/open-integration.patch
          git apply --unidiff-zero --exclude='.github/workflows/*' .rebuild/open-integration.patch
          python3 - <<'PY'
          import subprocess
          expected={
            'src/game/LabOpenArchitecture.js':'fe5fd47d43a206afbdc5c01f50ff60c248fe1f0a',
            'src/game/LabOpenChambers.js':'58cfbe805ca6bd2e8e62397698c9e11880f399bd',
            'src/game/LabOpenEdition.js':'8dfdcdfc4e0c79ac97c86fadfc39f871a43bf116',
            'src/game/LabOpenHydraulics.js':'887bf4df10cf8d02411dd44f51d68b80591a9057',
            'src/game/LabOpenJourney.js':'1be26489ebd984fb2731f9772e7dcd0cf4d23186',
            'src/game/LabOpenLaunch.js':'d6c92fbf45c331b1c1bcc9ef9835522ab54d7b79',
            'src/game/LabOpenStationArt.js':'982e0ee8b042482019da530d1871cba2bf343c89',
            'scripts/open-browser-review.mjs':'b2b786edd47b81235333f87392975cde6753d564',
            'tests/lab-open-chambers.test.js':'2c4a129b1891fda87ad13e1b600b6802f78bc753',
            'tests/lab-open-edition.test.js':'3708fb1bcca8037b2b69e8661fa33c8b2b9e1676',
            'tests/lab-open-hydraulics.test.js':'a3f23cb69e6cfbf3598d5a7c979b9aba5ae96362'
          }
          for name,sha in expected.items():
            actual=subprocess.check_output(['git','hash-object',name],text=True).strip()
            assert actual==sha,(name,actual,sha)
          print('All new source files match the locally tested bytes.')
          PY
          rm .rebuild/open-integration.patch .github/workflows/open-integrate.yml .github/workflows/rebuild-source.yml
      - name: Preserve integrated source on the rebuild branch
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'Integrate three spacious rebuilt chambers with isolated saves'
          git push origin HEAD:rebuild/open-chambers-20260922
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  review:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        room: [24, 28, 30]
    env:
      BUILD_COMMIT: ${{ needs.integrate.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          npm ci
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
          npm run build
          node scripts/stamp-build.mjs v39-campaign-30
      - name: Record native ordinary routes and real environment views
        env:
          ROOM: ${{ matrix.room }}
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >open-preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/open-browser-review.mjs
          ffmpeg -y -framerate 15 -i "qa/open-browser/${ROOM}-motion/%05d.png" -c:v libx264 -crf 19 -pix_fmt yuv420p -movflags +faststart "qa/open-browser/${ROOM}-motion.mp4"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: open-native-review-${{ matrix.room }}
          path: |
            qa/open-browser/
            open-preview.log
            dist/build-info.json
          retention-days: 14
