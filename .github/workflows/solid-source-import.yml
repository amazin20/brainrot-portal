name: Solid model repair verification
on:
  push:
    branches: [fix/solid-models-20260921]
    paths: [.github/workflows/solid-source-import.yml]
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          npm ci
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
      - name: Download the public patch using its ordinary share page
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node --input-type=module <<'JS'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';
          const folder='/tmp/solid-source-download';fs.mkdirSync(folder,{recursive:true});
          const browser=await puppeteer.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          const page=await browser.newPage();page.setDefaultTimeout(90000);
          const session=await page.createCDPSession();await session.send('Browser.setDownloadBehavior',{behavior:'allow',downloadPath:folder});
          await page.goto('https://firestorage.ai/ja/f/Fk5AuPYDgpq4',{waitUntil:'networkidle2',timeout:90000});
          await page.waitForFunction(()=>document.body.innerText.includes('solid-models-source-transfer.zip'));
          console.log('Share contents',await page.evaluate(()=>document.body.innerText));
          console.log('Links',await page.evaluate(()=>[...document.querySelectorAll('a')].map(a=>({text:a.textContent,url:a.href}))));
          const clicked=await page.evaluate(()=>{const el=[...document.querySelectorAll('button,a')].find(el=>/ダウンロード|Download/i.test(el.innerText||el.getAttribute('aria-label')||''));if(!el)return false;el.click();return true;});
          if(!clicked)throw new Error('The ordinary share page has no download control');
          let ready=false;for(let i=0;i<120;i++){if(fs.readdirSync(folder).some(n=>n.endsWith('.zip'))){ready=true;break;}await new Promise(r=>setTimeout(r,1000));}
          console.log('Downloaded files',fs.readdirSync(folder));await browser.close();
          if(!ready)throw new Error('Archive download did not complete');
          JS
      - name: Verify exact patch bytes and apply without weakening tests
        run: |
          python3 - <<'PY'
          import pathlib,zipfile,io,hashlib
          expected='658acd9f26edcae2569b436cde29f880b0d67bed37174eddc8405cdf2fa65610'
          def find_patch(data,depth=0):
            with zipfile.ZipFile(io.BytesIO(data)) as archive:
              for name in archive.namelist():
                if name.endswith('solid-models.patch'):return archive.read(name)
              if depth<2:
                for name in archive.namelist():
                  if name.endswith('.zip'):
                    found=find_patch(archive.read(name),depth+1)
                    if found:return found
          patches=[find_patch(p.read_bytes()) for p in pathlib.Path('/tmp/solid-source-download').glob('*.zip')]
          patch=next(p for p in patches if p and hashlib.sha256(p).hexdigest()==expected)
          pathlib.Path('/tmp/solid-models.patch').write_bytes(patch)
          print('Verified patch SHA-256',expected)
          PY
          git apply --check /tmp/solid-models.patch
          git apply /tmp/solid-models.patch
          rm .github/workflows/solid-source-import.yml
      - name: Commit the readable source to the repair branch only
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game scripts tests docs .github/workflows/solid-models-workspace.yml .github/workflows/solid-source-import.yml
          git commit -m "Replace nonphysical blockout props with closed manufactured models and synchronized compound collision"
          git push origin HEAD:fix/solid-models-20260921
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  models:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUILD_COMMIT: ${{ needs.apply.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          npm ci
          npm install --no-save --package-lock=false puppeteer-core@24.16.0 gltf-validator
          npm run build
          node scripts/stamp-build.mjs v39-campaign-30
          node scripts/export-solid-models.mjs qa/solid-models
      - name: Capture manufactured asset studies and real game views
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/solid-offline-capture.mjs
          npm run preview -- --host 127.0.0.1 --port 4173 >solid-preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node scripts/solid-preview-capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solid-models-native-review
          path: |
            smoke-artifacts/
            qa/solid-models/
            solid-preview.log
            dist/build-info.json
          retention-days: 14
  campaign:
    needs: apply
    uses: ./.github/workflows/verified-build.yml
    with:
      revision: ${{ needs.apply.outputs.revision }}
      record_puzzle: false
  motion:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        room: [24, 27, 28, 29, 30]
    env:
      BUILD_COMMIT: ${{ needs.apply.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          npm ci
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
          npm run build
          node scripts/stamp-build.mjs v39-campaign-30
      - name: Ordinary route and actual moving mechanism excerpts
        env:
          NESI_FIRST: ${{ matrix.room }}
          NESI_LAST: ${{ matrix.room }}
          NESI_UI: '0'
          NESI_CAPTURE_PUZZLE: '1'
          NESI_CAPTURE_FULL: '0'
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >solid-motion.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/v8-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solid-models-motion-${{ matrix.room }}
          path: |
            smoke-artifacts/
            solid-motion.log
          retention-days: 14
