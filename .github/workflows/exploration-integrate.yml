name: Integrated player exploration review
on:
  push:
    branches: [fix/player-exploration-20260922]
    paths: [.github/workflows/exploration-integrate.yml]
permissions:
  contents: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 40
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Merge the exact published revision using reviewed source resolutions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --depth=2 origin 436c184622377f7d311880fd17d54168d383957a
          git merge --no-commit --no-ff 436c184622377f7d311880fd17d54168d383957a || test -f .git/MERGE_HEAD
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,base64,lzma,hashlib
          expected_paths={'src/game/'+n for n in ['LabCamera.js','LabGame.js','LabOpenArchitecture.js','LabOpenStationArt.js','LabPortals.js']}
          paths=set(subprocess.check_output(['git','diff','--name-only','--diff-filter=U']).decode().splitlines())
          assert paths==expected_paths,paths
          subprocess.run(['git','checkout','--theirs',*sorted(paths)],check=True)
          subprocess.run(['git','add',*sorted(paths)],check=True)
          patch=lzma.decompress(base64.b64decode(Path('qa/transfer/merge-resolution.b64').read_text(),validate=True))
          assert hashlib.sha256(patch).hexdigest()=='1e4a5752f9a505e06c8ad0517b9e1472b1a706f08ed5703c79faac0ec8289dad'
          Path('/tmp/source-resolution.patch').write_bytes(patch)
          PY
          git apply --check /tmp/source-resolution.patch
          git apply /tmp/source-resolution.patch
          rm qa/transfer/merge-resolution.b64
          git add src scripts tests docs qa/transfer
          test -z "$(git diff --cached --name-only -- .github)"
          npm ci
          node --test tests/lab-player-exploration.test.js tests/lab-portal-warmup.test.js tests/lab-floor-portal-backing.test.js tests/lab-exploration-rooms.test.js tests/lab-hydraulic-feedback.test.js
      - id: commit
        run: |
          git commit -m "Merge published portal backing and shader fixes while retaining swept ramps and human-readable lab"
          git push origin HEAD:fix/player-exploration-20260922
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  native:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BUILD_COMMIT: ${{ needs.integrate.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          npm ci
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
          npm run build
          node scripts/stamp-build.mjs v39-campaign-30
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Preserve ordinary floor entry, return with companion, and room 28 route
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >exploration-preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/portal-regression-browser.mjs
          ROOM=28 node scripts/open-browser-review.mjs
          ffmpeg -y -framerate 15 -i qa/portal-regression/0-frames/%05d.png -c:v libx264 -crf 20 -pix_fmt yuv420p -movflags +faststart qa/floor-return.mp4
          ffmpeg -y -framerate 15 -i qa/open-browser/28-motion/%05d.png -c:v libx264 -crf 20 -pix_fmt yuv420p -movflags +faststart qa/hydraulic-lab.mp4
      - name: Record the reported uphill jump from an explicitly staged reproduction start
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';import puppeteer from 'puppeteer-core';
          fs.mkdirSync('qa/ramp-frames',{recursive:true});
          const browser=await puppeteer.launch({executablePath:process.env.CHROME_PATH,headless:true,protocolTimeout:600000,args:['--no-sandbox','--disable-dev-shm-usage','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          try{const p=await browser.newPage();p.setDefaultTimeout(180000);await p.setViewport({width:1280,height:720});const errors=[];p.on('pageerror',e=>errors.push(String(e)));
          await p.goto('http://127.0.0.1:4173/?edition=open&debug=1&level=30',{waitUntil:'networkidle2'});await p.waitForFunction(()=>window.__NESI_DEMO_GAME__?.state==='ready');await p.click('#play-button');
          const data=await p.evaluate(()=>{const g=window.__NESI_DEMO_GAME__;g.renderer.setAnimationLoop(null);g.resetRun(true);const r=g.ramps[0],z=-8;
          const height=z=>r.lowY+(r.highY-r.lowY)*(r.highAt==='minZ'?(r.maxZ-z)/(r.maxZ-r.minZ):(z-r.minZ)/(r.maxZ-r.minZ));
          g.playerPosition.set(-46,height(z),z);g.previousPlayerPosition.copy(g.playerPosition);g.playerVelocity.set(0,0,-15);g.playerGrounded=true;g.yaw=0;g.pitch=-.2;g.cameraRig.reset(g.playerPosition,g.yaw,g.pitch);g.input.keys.add('ShiftLeft');g.input.getMove=()=>({x:0,y:-1,lengthSq:()=>1,clone(){return this;}});g.input.jumpQueued=true;
          const frames=[],trace=[];let minimum=0,left=false,landed=false;
          for(let i=0;i<360;i++){g.updatePlaying(1/120);g.updateVisuals(1/120,1);left ||= !g.playerGrounded;landed ||= left&&g.playerGrounded;
           if(g.playerPosition.z>=r.minZ&&g.playerPosition.z<=r.maxZ)minimum=Math.min(minimum,g.playerPosition.y-height(g.playerPosition.z));
           if(i%8===0){g.render();frames.push(g.renderer.domElement.toDataURL('image/png').split(',')[1]);trace.push({tick:i,p:g.playerPosition.toArray(),grounded:g.playerGrounded});}}
          return{frames,trace,minimum,left,landed,kind:'Staged initial ramp pose, then ordinary run/jump input and real simulation; not full manual playthrough'};});
          assert.deepEqual(errors,[]);assert.ok(data.left&&data.landed);assert.ok(data.minimum>=-.001,JSON.stringify(data));
          data.frames.forEach((f,i)=>fs.writeFileSync('qa/ramp-frames/'+String(i).padStart(5,'0')+'.png',Buffer.from(f,'base64')));delete data.frames;data.source=process.env.BUILD_COMMIT;fs.writeFileSync('qa/ramp-reproduction.json',JSON.stringify(data,null,2));
          }finally{await browser.close();}
          JS
          ffmpeg -y -framerate 15 -i qa/ramp-frames/%05d.png -c:v libx264 -crf 20 -pix_fmt yuv420p -movflags +faststart qa/uphill-jump.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-exploration-native
          path: |
            qa/*.mp4
            qa/*.json
            qa/open-browser/*.png
            qa/open-browser/*.json
            qa/portal-regression/*.png
            qa/portal-regression/*.json
            exploration-preview.log
            dist/build-info.json
          retention-days: 14
  profile:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 436c184622377f7d311880fd17d54168d383957a
          path: before
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.revision }}
          path: after
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          cp after/scripts/profile-exploration.mjs before/scripts/profile-exploration.mjs
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          ROOT="$PWD";mkdir -p "$ROOT/profile-evidence"
          for VERSION in before after; do
            cd "$ROOT/$VERSION"
            npm ci
            npm install --no-save --package-lock=false puppeteer-core@24.16.0
            npm run build
            BUILD_COMMIT="$(git rev-parse HEAD)" node scripts/stamp-build.mjs v39-campaign-30
            if [ "$VERSION" = before ]; then PORT=4174; else PORT=4175; fi
            npm run preview -- --host 127.0.0.1 --port "$PORT" >"$ROOT/profile-evidence/$VERSION-preview.log" 2>&1 &
            for i in {1..30}; do curl -fsS "http://127.0.0.1:$PORT/" >/dev/null && break; sleep 1; done
            PAGE_URL="http://127.0.0.1:$PORT/" OUT="$ROOT/profile-evidence/$VERSION" node scripts/profile-exploration.mjs
            cp dist/build-info.json "$ROOT/profile-evidence/$VERSION/build-info.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-exploration-profile
          path: profile-evidence/
          retention-days: 14
