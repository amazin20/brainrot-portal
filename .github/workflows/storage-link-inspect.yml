name: Inspect authorized release archive
on:
  push:
    branches: ['release/tactile-twenty-v17']
    paths: ['.github/workflows/storage-link-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect public archive download page
        run: |
          python3 - <<'PY'
          import urllib.request,re,pathlib
          url='https://firestorage.ai/ja/f/NxI602TwrMI_'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=30) as r:
              text=r.read().decode();print('PAGE',r.status,r.url)
          pathlib.Path('/tmp/storage-page.html').write_text(text)
          print(text[:3000])
          for m in re.finditer(r'.{0,160}(?:download|api/|zX21MUc|01a07a405|script src).{0,220}',text,re.I): print(m.group())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: storage-download-metadata
          path: /tmp/storage-page.html
          retention-days: 1
