name: Import and verify twenty-room candidate
on:
  push:
    branches: ['release/tactile-twenty-v17']
    paths: ['.github/workflows/import-verified-v17.yml']
permissions:
  contents: write
concurrency:
  group: import-twenty-room-candidate
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fetch complete authorized archive and verify every byte before extraction
        run: |
          python3 - <<'PY'
          import urllib.request,json,hashlib,zipfile,io,pathlib,stat
          api='https://api.firestorage.ai/dev/file/shares/NxI602TwrMI_'
          req=urllib.request.Request(api+'/files/01a07a405d7676beb27bd79e6bf76a57/download',method='POST')
          with urllib.request.urlopen(req,timeout=30) as response: link=json.load(response)['downloadUrl']
          assert link.startswith('https://')
          with urllib.request.urlopen(link,timeout=60) as response: raw=response.read(20000000)
          expected='d9beb5c3f52e0a5dec4574eb43a59431dc8fa1a83cc1c9d8430d2d6cfaa18f77'
          assert len(raw)==8199968 and hashlib.sha256(raw).hexdigest()==expected,'Archive integrity mismatch'
          z=zipfile.ZipFile(io.BytesIO(raw));assert z.testzip() is None
          assert len(z.infolist())==170
          roots={'src','scripts','tests','docs','public'}
          files={'index.html','package.json','package-lock.json','vite.config.js','README.md','PROJECT_STATUS.md'}
          for entry in z.infolist():
              p=pathlib.PurePosixPath(entry.filename)
              assert not p.is_absolute() and '..' not in p.parts and '\\' not in entry.filename
              assert p.parts[0] in roots or entry.filename in files
              assert not stat.S_ISLNK(entry.external_attr>>16)
              target=pathlib.Path(entry.filename);target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(z.read(entry))
          print('Imported 170 full source/assets files:',expected)
          PY
      - name: Save recovered candidate on review branch only
        run: |
          test "$GITHUB_REF_NAME" = 'release/tactile-twenty-v17'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts tests docs public/models/runtime index.html package.json package-lock.json vite.config.js README.md PROJECT_STATUS.md
          git diff --cached --stat
          git diff --cached --quiet || git commit -m 'Recover full twenty-room gameplay and nine complete articulated supplied GLBs'
          git push origin HEAD:refs/heads/release/tactile-twenty-v17
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install browser testing dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
      - name: Verify all source, complete routes and bounded bypass attempts
        run: |
          npm run check
          node scripts/v8-package-check.mjs
          node scripts/v8-journey.mjs
          node scripts/v10-shortcuts.mjs
          node scripts/v17-audit.mjs
          npm run build -- --mode yandex --outDir dist-yandex
      - name: Chromium gameplay, settings, audio and SDK-contract verification
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/preview.log 2>&1 &
          python3 -m http.server 4174 --bind 127.0.0.1 --directory dist-yandex >/tmp/yandex-preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/v8-browser.mjs
          node scripts/v8-yandex-browser.mjs
      - name: Record tested revision
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          fs.writeFileSync('dist/build-info.json',JSON.stringify({commit:process.env.SOURCE_COMMIT,version:'v17-twenty',levels:20,verified:true,run:process.env.GITHUB_RUN_ID}));
          NODE
      - name: Preserve complete evidence, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v17-release-evidence
          path: |
            smoke-artifacts/
            qa/v8-journeys.json
            qa/v10-shortcut-audit.json
            qa/v17-adversarial.json
          retention-days: 7
      - name: Preserve tested build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v17-tested-browser
          path: dist/
          retention-days: 7
