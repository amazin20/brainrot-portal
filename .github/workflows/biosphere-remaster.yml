name: Biosphere architectural remaster
on:
  push:
    branches: [upgrade/tz-completion-20261023]
    paths:
      - '.github/workflows/biosphere-remaster.yml'
      - 'src/game/LabBiosphereArchitecture.js'
      - 'tests/lab-biosphere-architecture.test.js'
      - 'tools/qa-biosphere-remaster.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: biosphere-remaster-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve exact source for local development and review
        run: |
          mkdir -p evidence
          git archive --format=tar HEAD | gzip -n > evidence/source.tar.gz
          git rev-parse HEAD > evidence/source-sha.txt
          sha256sum evidence/source.tar.gz > evidence/source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: biosphere-exact-source
          path: evidence/
          retention-days: 14
          if-no-files-found: error
