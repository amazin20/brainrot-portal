name: Foundation native review
on:
  pull_request:
    paths:
      - 'src/game/LabFoundation*.js'
      - 'src/main.js'
      - 'scripts/foundation-browser.mjs'
      - '.github/workflows/foundation-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chapter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        room: [1, 2, 3, 4, 5]
    env:
      BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_COMMIT }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          npm ci
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
          npm run build
          node scripts/stamp-build.mjs v40-laboratory-33
      - name: Capture the playable first chapter with ordinary and exploratory input
        env:
          ROOMS: ${{ matrix.room }}
          RECORD: '1'
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >foundation-preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/foundation-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-recording-${{ matrix.room }}
          path: |
            qa/foundation-browser/
            foundation-preview.log
          retention-days: 14
