name: Airflow source workspace
on:
  push:
    branches: ['polish/room11-airflow']
    paths: ['.github/workflows/airflow-source.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip -o /tmp/airflow-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: airflow-source
          path: /tmp/airflow-source.zip
          retention-days: 1
