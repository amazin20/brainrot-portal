name: Show current demo version in README
on:
  workflow_run:
    workflows: [Publish current GitHub demo]
    branches: [main]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: current-demo-readme
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'amazin20/brainrot-portal' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run=context.payload.workflow_run;
            if(run.path!=='.github/workflows/publish-current-demo.yml'||run.head_branch!=='main')throw Error('Unexpected publisher');
            const response=await fetch('https://amazin20.github.io/brainrot-portal/demo-publication.json?readme='+Date.now());
            if(!response.ok)throw Error('Published version is not reachable');
            const live=await response.json();
            if(live.publicationRun!==run.id){core.notice('A newer publication is live; do not replace its README');return;}
            if(!/^[a-f0-9]{40}$/.test(live.sourceCommit)||!Number.isFinite(Date.parse(live.publishedAt)))throw Error('Invalid public identity');
            const start='<!-- current-demo:start -->',end='<!-- current-demo:end -->';
            const block=[start,'## Актуальная демка — обновляется автоматически','',
              '**[ИГРАТЬ В ОБНОВЛЁННУЮ ДЕМКУ](https://amazin20.github.io/brainrot-portal/campaign-v67/?v='+live.sourceCommit.slice(0,7)+')**','',
              'Публикация: **'+live.publishedAt.replace('T',' ').replace('Z',' UTC')+'**. Исходник: [`'+live.sourceCommit.slice(0,7)+'`](https://github.com/amazin20/brainrot-portal/tree/'+live.sourceCommit+').',
              '',
              'Демка собирается целиком из `upgrade/tz-completion-20261023` после каждого изменения ветки. Публикация выполняется только после успешной сборки, проверок сохранений/доступа и запуска в браузере. Затем проверяется уже публичная игра. Старый прогон не может заменить более новый исходник.',
              '',
              'В текущей линии разработки объединены меню Atlas, переработанная «Биосфера», «Ночная обсерватория», архитектура финального замка и предыдущие игровые исправления. Дата и короткий SHA также показаны в меню игры.',
              '',
              '**Это рабочая демоверсия, не завершённая приёмка всей кампании.** Полный поиск ошибок, человеческий плейтест, аппаратные замеры и живая проверка Яндекс Игр остаются отдельными задачами. Сохранения продолжают использовать прежний адрес; исторические версии и видео не удаляются. Яндекс Игры автоматически не публикуются.',
              '',
              '[Проверка этой публикации]('+run.html_url+') · [Точный публичный штамп](https://amazin20.github.io/brainrot-portal/demo-publication.json) · [Автосборки](https://github.com/amazin20/brainrot-portal/actions/workflows/current-demo-build.yml)',
              '',
              'Ниже сохранены **исторические** отчёты отдельных релизов; их старые даты и числа проверок не являются датой обновления текущей демки.',end].join('\n');
            for(let attempt=0;attempt<2;attempt++){
              const current=(await github.rest.repos.getContent({...context.repo,path:'README.md',ref:'main'})).data;
              let text=Buffer.from(current.content,'base64').toString('utf8');
              const a=text.indexOf(start),b=text.indexOf(end);
              if(a>=0&&b>a)text=text.slice(0,a)+block+text.slice(b+end.length);
              else{const at=text.indexOf('\n');text=text.slice(0,at+1)+'\n'+block+'\n'+text.slice(at+1);}
              text=text.replace('## Кампания v67: исправления визуальных недочётов','## Историческая приёмка v67 — 22 октября 2026');
              try{await github.rest.repos.createOrUpdateFileContents({...context.repo,path:'README.md',branch:'main',sha:current.sha,content:Buffer.from(text).toString('base64'),message:'Show the actual current demo publication '+live.sourceCommit.slice(0,7)+' after live verification'});return;}
              catch(e){if(e.status!==409||attempt===1)throw e;}
            }
