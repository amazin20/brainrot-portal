name: Tower redesign workspace
on:
  push:
    branches: [feature/tower-singularity]
    paths: [.github/workflows/tower-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          npm ci
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
          mkdir -p /tmp/tower-source
          git ls-files -z | tar --null -T - -czf /tmp/tower-source/source.tgz
          tar -czf /tmp/tower-source/dependencies.tgz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: tower-design-workspace
          path: /tmp/tower-source/
          retention-days: 2
