name: Single-room polish workspace
on:
  push:
    branches: ['polish/one-readable-room']
    paths: ['.github/workflows/room-polish-workspace.yml']
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm install --no-save --package-lock=false puppeteer-core@24.16.0
      - name: Export exact source and offline tools without repository credentials
        run: |
          git rev-parse HEAD > /tmp/source-revision.txt
          tar --exclude='./.git' --exclude='./dist' --exclude='./qa' --exclude='./smoke-artifacts' -czf /tmp/room-polish-workspace.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: room-polish-workspace
          path: |
            /tmp/room-polish-workspace.tgz
            /tmp/source-revision.txt
          retention-days: 1
