name: Import single-room correction
on:
  push:
    branches: ['polish/one-readable-room']
    paths: ['.github/workflows/import-room-polish.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check and extract nine authorized text files only
        run: |
          python3 - <<'PY'
          import urllib.request,hashlib,json,zipfile,io,pathlib,stat
          url='https://api.firestorage.ai/dev/file/shares/NxI602TwrMI_/files/01a07b27a4b47781ac4d0be2ad75dc94/download'
          with urllib.request.urlopen(urllib.request.Request(url,method='POST'),timeout=30) as r: link=json.load(r)['downloadUrl']
          assert link.startswith('https://')
          with urllib.request.urlopen(link,timeout=30) as r: data=r.read(1000000)
          assert len(data)==17832 and hashlib.sha256(data).hexdigest()=='4c80047404b5242840bf5da3c8f82dbc496babf05760509f83e7a29ff57d8307'
          allowed={'src/game/LabWindRoom.js','src/game/LabCampaignLevels.js','src/game/LabTutorial.js','src/game/LabWorkshopJourney.js','scripts/room-polish-browser.mjs','tests/lab-wind-room.test.js','tests/lab-workshop-safety.test.js','docs/ROOM_11_POLISH.md','PROJECT_STATUS.md'}
          z=zipfile.ZipFile(io.BytesIO(data));assert z.testzip() is None and set(z.namelist())==allowed
          for e in z.infolist():
              assert not stat.S_ISLNK(e.external_attr>>16)
              p=pathlib.Path(e.filename);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(z.read(e))
          PY
      - name: Save review branch only
        run: |
          test "$GITHUB_REF_NAME" = 'polish/one-readable-room'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts tests docs PROJECT_STATUS.md
          git commit -m 'Polish room eleven only: grounded properly facing machines, true front rotor and readable exit'
          git push origin HEAD:refs/heads/polish/one-readable-room
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm install --no-save --package-lock=false puppeteer-core@24.16.0
      - run: npm run check && node scripts/v8-journey.mjs
      - name: Render actual room and complete the normal-control route
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/room-polish-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: room-polish-first-review
          path: |
            room-evidence/
            qa/v8-journeys.json
          retention-days: 7
