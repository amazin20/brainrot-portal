name: Finish verified balance repair
on:
  push:
    branches: ['polish/balance-geometry-v19']
    paths: ['.github/workflows/finish-balance-review.yml']
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: finish-balance-pr14
  cancel-in-progress: false
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Keep the already prepared repair and every existing check
        run: |
          test "$GITHUB_REF_NAME" = 'polish/balance-geometry-v19'
          git merge-base --is-ancestor 446650cc4d16cc02e7e28adcffe5bcd12ae883be HEAD
          git diff --exit-code 446650cc4d16cc02e7e28adcffe5bcd12ae883be HEAD -- . ':!.github/workflows/finish-balance-review.yml'
          python3 - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/demo-smoke.yml').read_text()
          required=('npm run check','scripts/v8-journey.mjs','scripts/v17-audit.mjs','scripts/v17-recovery.mjs','scripts/video-repro.mjs','scripts/v8-browser.mjs','scripts/video-repair-browser.mjs','scripts/v8-yandex-browser.mjs')
          assert all(item in source for item in required), 'Existing required checks must not be removed'
          assert Path('src/game/LabBalanceModel.js').is_file()
          assert Path('tests/lab-balance-model.test.js').is_file()
          assert Path('docs/BALANCE_AND_UPDRAFT_REPAIR.md').is_file()
          PY
      - name: Wait for exact source verification and publish with a normal guarded merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -u - <<'PY'
          import os,json,time,pathlib,urllib.request,zipfile,io,hashlib
          api='https://api.github.com/repos/amazin20/nesi-brainrot'
          head=os.environ['GITHUB_SHA'];baseline='037b7a9fd1cf6a52588711d648dc4d1bae121977'
          out=pathlib.Path('balance-release-evidence');out.mkdir(exist_ok=True)
          report={'pass':False,'pr':14,'reviewed_head':head,'scope':'Existing rooms 7 and 8 model/support repairs, preserving the published V18 core. Not a full 9-10 art or portal-camera redesign.'}
          def request(path,method='GET',data=None):
              body=None if data is None else json.dumps(data).encode()
              req=urllib.request.Request(api+path,data=body,method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'NESI-release-check','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  b=r.read();return json.loads(b) if b else None
          try:
              pr=request('/pulls/14')
              assert pr['head']['sha']==head and pr['head']['repo']['full_name']=='amazin20/nesi-brainrot'
              assert pr['state']=='open' and not pr['merged'] and pr['base']['ref']=='main'
              for attempt in range(180):
                  runs=request('/actions/runs?event=pull_request&head_sha='+head+'&per_page=100')['workflow_runs']
                  runs=[r for r in runs if r['name']=='Playable campaign verification' and r['head_sha']==head]
                  if runs:
                      check=max(runs,key=lambda r:r['id'])
                      if check['status']=='completed':
                          assert check['conclusion']=='success','Exact-head required check failed: '+str(check['id'])
                          break
                  print('Waiting for exact-head campaign verification',attempt,flush=True);time.sleep(10)
              else:raise RuntimeError('Required verification did not complete')
              report['review']={'run':check['id'],'url':check['html_url'],'conclusion':check['conclusion']}
              artifacts=request('/actions/runs/'+str(check['id'])+'/artifacts')['artifacts']
              proof=next(a for a in artifacts if a['name']=='campaign-verification' and not a['expired'])
              req=urllib.request.Request(proof['archive_download_url'],headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'User-Agent':'NESI-release-check'})
              with urllib.request.urlopen(req,timeout=60) as r: raw=r.read(150000001)
              assert len(raw)<=150000000,'Unexpected proof size'
              digest=hashlib.sha256(raw).hexdigest()
              if proof.get('digest'):assert proof['digest']=='sha256:'+digest
              report['review']['artifact']=proof['id'];report['review']['sha256']=digest
              z=zipfile.ZipFile(io.BytesIO(raw));assert z.testzip() is None
              browser=json.loads(z.read('smoke-artifacts/report.json'))
              assert len(browser['routes'])==20 and browser.get('errors')==[]
              assert all(r.get('pass') and r.get('respawns')==0 and r.get('resets')==0 for r in browser['routes'])
              report['routes']=browser['routes']
              saved=[]
              for name in z.namelist():
                  p=pathlib.PurePosixPath(name)
                  if p.is_absolute() or '..' in p.parts:continue
                  if p.suffix.lower()=='.png' and any(t in p.name for t in ('level-7','level-8','balance','updraft')):
                      target=out/p.name;target.write_bytes(z.read(name));saved.append(p.name)
              assert any('7' in n or 'balance' in n for n in saved) and any('8' in n or 'updraft' in n for n in saved),'Room visual evidence missing'
              report['rendered_evidence']=saved
              pr=request('/pulls/14');current=request('/git/ref/heads/main')['object']['sha']
              assert pr['head']['sha']==head and not pr['merged'] and current==baseline,'Concurrent change; refusing to replace it'
              merged=request('/pulls/14/merge','PUT',{'sha':head,'merge_method':'squash','commit_title':'Repair seesaw model proportions and complete articulation; align the updraft fan','commit_message':'PR14 exact-head full source, twenty physical and Chromium journeys, carry/shot regressions, adversarial and recovery checks passed. Rendered room7/8 evidence preserved. Original models and V18 core retained; no new levels. Scope: docs/BALANCE_AND_UPDRAFT_REPAIR.md.'})
              assert merged.get('merged') is True;commit=merged['sha'];report['commit']=commit
              assert request('/git/ref/heads/main')['object']['sha']==commit
              request('/actions/workflows/deploy-pages.yml/dispatches','POST',{'ref':'main'})
              for attempt in range(180):
                  runs=request('/actions/workflows/deploy-pages.yml/runs?branch=main&per_page=30')['workflow_runs']
                  matches=[r for r in runs if r['head_sha']==commit]
                  if matches:
                      deployed=max(matches,key=lambda r:r['id'])
                      if deployed['status']=='completed':
                          report['deployment']={'run':deployed['id'],'url':deployed['html_url'],'conclusion':deployed['conclusion']}
                          assert deployed['conclusion']=='success','Deployment/public browser check failed'
                          break
                  print('Waiting for full publication and public browser check',attempt,flush=True);time.sleep(10)
              else:raise RuntimeError('Publication did not finish')
              public='https://amazin20.github.io/nesi-brainrot/'
              with urllib.request.urlopen(public+'build-info.json?verified='+commit,timeout=30) as r:info=json.load(r)
              assert info['commit']==commit and info['levels']==20 and info.get('verified') is True
              report['build']=info;report['demo']=public+'?v='+commit[:8]+'&level=7';report['pass']=True
              print(json.dumps(report,ensure_ascii=False,indent=2))
          except Exception as e:
              report['error']=str(e);raise
          finally:(out/'result.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Preserve exact release outcome and rendered room evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balance-release-result
          path: balance-release-evidence/
          retention-days: 14
