name: Playable campaign verification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: review-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/verified-build.yml
    with:
      revision: ${{ github.event.pull_request.head.sha || github.sha }}
