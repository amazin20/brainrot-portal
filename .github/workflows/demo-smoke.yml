name: Playable campaign verification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked game and browser driver
        run: |
          npm ci
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
      - name: Source tests, all twenty routes and full-world adversarial checks
        run: |
          npm run check
          node scripts/v8-package-check.mjs
          node scripts/v8-journey.mjs
          node scripts/v10-shortcuts.mjs
          node scripts/v17-audit.mjs
          node scripts/v17-recovery.mjs
          node scripts/video-repro.mjs
          npm run build -- --mode yandex --outDir dist-yandex
      - name: Production WebGL routes, video regressions, real menus and advertising contract
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/preview.log 2>&1 &
          python3 -m http.server 4174 --bind 127.0.0.1 --directory dist-yandex >/tmp/yandex-preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/v8-browser.mjs
          node scripts/video-repair-browser.mjs
          node scripts/v8-yandex-browser.mjs
      - name: Record reviewed revision
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {CAMPAIGN} from './src/game/LabCampaignLevels.js';
          fs.writeFileSync('dist/build-info.json',JSON.stringify({commit:process.env.GITHUB_SHA,version:'v18-core',levels:CAMPAIGN.length,verified:true,run:process.env.GITHUB_RUN_ID},null,2));
          NODE
      - name: Preserve rendered and physical verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-verification
          path: |
            smoke-artifacts/
            qa/v8-journeys.json
            qa/v10-shortcut-audit.json
            qa/v17-adversarial.json
            qa/v17-recovery.json
            qa/video-after.json
            video-repair-evidence/
          retention-days: 14
      - name: Preserve reviewed browser package
        uses: actions/upload-artifact@v4
        with:
          name: campaign-browser
          path: dist/
          retention-days: 14
      - name: Preserve Yandex draft (SDK contract tested, not live ads)
        uses: actions/upload-artifact@v4
        with:
          name: campaign-yandex-draft
          path: dist-yandex/
          retention-days: 14
