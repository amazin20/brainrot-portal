name: Playable campaign verification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    # The version-pinned legacy profile is superseded for the 51-room release
    # by expedition-release-review.yml, including all its retained routes.
    if: github.event_name != 'pull_request' || github.head_ref != 'upgrade/release-expansion-20261004'
    uses: ./.github/workflows/verified-build.yml
    with:
      revision: ${{ github.event.pull_request.head.sha || github.sha }}
      # Every ordinary WebGL route and its native milestone stills always run.
      # Full motion review lives in the dedicated review workflows; re-encode
      # legacy excerpts only for an explicitly dispatched verification run.
      record_puzzle: ${{ github.event_name == 'workflow_dispatch' }}
