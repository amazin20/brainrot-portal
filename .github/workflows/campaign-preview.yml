name: Interlaced campaign layout preview

# Fast visual iteration only. The full verified campaign jobs remain the
# release gate; this workflow cannot publish or replace their evidence.
on:
  push:
    branches:
      - feature/interlaced-campaign-v29
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interlaced-layout-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_COMMIT: ${{ github.sha }}

jobs:
  layout:
    name: Ordinary room ${{ matrix.room }} route and native milestone stills
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        room: [12, 13, 14, 15]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build the exact preview revision
        run: |
          npm ci
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
          npm run build
          node scripts/stamp-build.mjs v29-interlaced-campaign
      - name: Capture the ordinary route without video frame sampling
        env:
          NESI_FIRST: ${{ matrix.room }}
          NESI_LAST: ${{ matrix.room }}
          NESI_UI: '0'
          NESI_CAPTURE_PUZZLE: '0'
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >interlaced-preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/v8-browser.mjs
      - name: Preserve the native layout preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interlaced-layout-preview-${{ matrix.room }}
          path: |
            smoke-artifacts/
            interlaced-preview.log
            dist/build-info.json
          if-no-files-found: error
          retention-days: 7
