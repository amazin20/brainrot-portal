          async function noDebug(){assert.deepEqual(await page.evaluate(()=>Object.getOwnPropertyNames(window).filter(key=>key.startsWith('__NESI_'))),[]);}
          async function ordinaryRoom33(){await page.waitForFunction(()=>document.documentElement.dataset.runtimeState==='playing'&&document.documentElement.dataset.levelIndex==='32'&&document.documentElement.dataset.gameReady==='true');await noDebug();}
          async function pause(touch){if(touch)await activate(page,'.lab-mobile button:nth-child(4)',true);else await page.keyboard.press('Escape');await page.waitForFunction(()=>document.documentElement.dataset.runtimeState==='paused');}
          try{
