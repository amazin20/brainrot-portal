              await page.$eval('#play-button',element=>element.addEventListener('click',event=>document.documentElement.dataset.siphonTrustedPlay=String(event.isTrusted),{once:true,capture:true}));
              await activate(page,'#play-button',viewport.touch);await ordinaryRoom33();
              assert.equal(await page.evaluate(()=>document.documentElement.dataset.siphonTrustedPlay),'true');await noDebug();await page.screenshot({path:out+'/playing-'+viewport.width+'.png'});
