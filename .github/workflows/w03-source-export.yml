name: W03 reviewed source export
on:
  push:
    branches: [ci/w00-workspace-snapshot]
    paths: [.github/workflows/w03-source-export.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4d179a004458ccf06c1ba6514837507d553234cb
          persist-credentials: false
      - run: |
          git archive --format=tar.gz HEAD -o reviewed-source.tar.gz
          git rev-parse HEAD > reviewed-source.commit
          sha256sum reviewed-source.tar.gz > reviewed-source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: w03-reviewed-source
          path: |
            reviewed-source.tar.gz
            reviewed-source.commit
            reviewed-source.sha256
          retention-days: 1
          if-no-files-found: error
