name: Portal latency native review
on:
  push:
    branches: [fix/portal-traversal-performance-20260922]
    paths: [.github/workflows/portal-profile-review.yml]
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          npm ci
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
          npm run dev -- --host 127.0.0.1 --port 4173 >portal-preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          export PROFILE_SOURCE="$(git rev-parse HEAD)"
          PROFILE_LABEL=before node scripts/portal-profile.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-profile-before
          path: |
            qa/portal-profile/
            portal-preview.log
          retention-days: 14
