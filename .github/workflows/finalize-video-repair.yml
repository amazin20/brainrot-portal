name: Finish verified video repair
on:
  push:
    branches: ['fix/carry-wind-shot-review']
    paths: ['.github/workflows/finalize-video-repair.yml']
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: finalize-video-repair-pr13
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Guard the already prepared repair against unrelated changes
        run: |
          test "$GITHUB_REF_NAME" = 'fix/carry-wind-shot-review'
          git merge-base --is-ancestor a37b32cc77be8cab95abfbaa2af151fcd1aef10b HEAD
          git diff --exit-code a37b32cc77be8cab95abfbaa2af151fcd1aef10b HEAD -- . ':!.github/workflows/finalize-video-repair.yml'
          test -f docs/VIDEO_REPAIR_V18.md
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/demo-smoke.yml').read_text()
          for command in ('npm run check','scripts/v8-journey.mjs','scripts/v17-audit.mjs','scripts/v17-recovery.mjs','scripts/v8-browser.mjs','scripts/v8-yandex-browser.mjs'):
              assert command in s, 'A required existing verification gate is missing: '+command
          focused=[p for p in Path('scripts').glob('*.mjs') if any(x in p.name.lower() for x in ('video','repair','regression','v18')) and 'puppeteer' in p.read_text()]
          assert focused, 'Recorded-video browser regression script is missing'
          assert any(p.name in s for p in focused), 'Recorded-video regression must run in the required gameplay check'
          print('Exact prepared repair retained; complete existing checks remain required.')
          PY
      - name: Wait for exact-head PR checks, merge normally, and verify the existing deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,time,pathlib,urllib.request
          repo='amazin20/nesi-brainrot'; api='https://api.github.com/repos/'+repo
          head=os.environ['GITHUB_SHA']; baseline='228accb2bfce4ff620c743f68c3d52c2e9e46a4d'
          out=pathlib.Path('release-evidence');out.mkdir(exist_ok=True)
          report={'pass':False,'reviewed_head':head,'pr':13,'checks':[]}
          def request(path,method='GET',data=None):
              body=None if data is None else json.dumps(data).encode()
              r=urllib.request.Request(api+path,data=body,method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'NESI-verified-release','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(r,timeout=30) as response:
                  raw=response.read();return json.loads(raw) if raw else None
          try:
              pr=request('/pulls/13')
              assert not pr['merged'] and pr['state']=='open'
              assert pr['head']['sha']==head and pr['head']['repo']['full_name']==repo
              assert pr['base']['ref']=='main' and pr['base']['sha']==baseline
              required={'Playable campaign verification','Room11 airflow visual review'}
              for attempt in range(160):
                  runs=request('/actions/runs?event=pull_request&head_sha='+head+'&per_page=100')['workflow_runs']
                  latest={}
                  for run in runs:
                      if run['name'] in required and run['head_sha']==head:
                          old=latest.get(run['name'])
                          if old is None or run['id']>old['id']:latest[run['name']]=run
                  failures=[r for r in latest.values() if r['status']=='completed' and r['conclusion']!='success']
                  assert not failures, 'Required verification failed: '+str([(r['id'],r['conclusion']) for r in failures])
                  if required<=latest.keys() and all(r['status']=='completed' and r['conclusion']=='success' for r in latest.values()):
                      report['checks']=[{'name':r['name'],'run':r['id'],'conclusion':r['conclusion'],'url':r['html_url']} for r in latest.values()]
                      break
                  print('Waiting for exact-head gameplay and visual checks',attempt,flush=True);time.sleep(10)
              else:raise RuntimeError('Exact-head required checks did not finish successfully')
              pr=request('/pulls/13'); main=request('/git/ref/heads/main')['object']['sha']
              assert pr['head']['sha']==head and main==baseline and not pr['merged'], 'Concurrent repository change: stopping without merging'
              merged=request('/pulls/13/merge','PUT',{'sha':head,'merge_method':'squash','commit_title':'Repair recorded companion grip, automatic physical wind and animated portal shots','commit_message':'Exact-head gameplay and visual checks passed before normal PR13 merge. Existing 20 rooms and original assets retained. Source scope and known remaining art/portal-camera work: docs/VIDEO_REPAIR_V18.md.'})
              assert merged.get('merged') is True; commit=merged['sha'];report['commit']=commit
              assert request('/git/ref/heads/main')['object']['sha']==commit
              request('/actions/workflows/deploy-pages.yml/dispatches','POST',{'ref':'main'})
              for attempt in range(160):
                  runs=request('/actions/workflows/deploy-pages.yml/runs?branch=main&per_page=20')['workflow_runs']
                  matches=[r for r in runs if r['head_sha']==commit]
                  if matches:
                      run=max(matches,key=lambda r:r['id'])
                      if run['status']=='completed':
                          report['deployment']={'run':run['id'],'conclusion':run['conclusion'],'url':run['html_url']}
                          assert run['conclusion']=='success', 'Publication or public-site verification failed'
                          break
                  print('Waiting for full deployment and public-browser verification',attempt,flush=True);time.sleep(10)
              else:raise RuntimeError('Deployment verification timed out')
              url='https://amazin20.github.io/nesi-brainrot/'
              with urllib.request.urlopen(url+'build-info.json?verify='+commit,timeout=30) as response:info=json.load(response)
              assert info['commit']==commit and info['levels']==20
              report['build']=info;report['demo']=url+'?v='+commit[:8]+'&level=11';report['pass']=True
              print(json.dumps(report,ensure_ascii=False,indent=2))
          except Exception as error:
              report['error']=str(error);raise
          finally:(out/'result.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Preserve the exact release result, including any blocker
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-repair-release-result
          path: release-evidence/
          retention-days: 14
