name: Native research review without repository writes
on:
  push:
    branches: [feat/laboratory-chapter-31-33]
    paths: [.github/workflows/research-wire.yml]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        room: [31, 32, 33]
    env:
      ROOMS: ${{ matrix.room }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare and identify the local test tree without pushing repository changes
        run: |
          python3 .github/research-wire.py
          git config user.name 'Local verification snapshot'
          git config user.email 'local-verification@example.invalid'
          git add src/game scripts tests docs .github
          git commit -m 'Local research verification snapshot (not pushed)'
          echo "BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          mkdir -p qa/research-source
          git rev-parse HEAD > qa/research-source/COMMIT
          git rev-parse HEAD^{tree} > qa/research-source/TREE
          git archive --format=tar.gz HEAD > qa/research-source/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: research-source-${{ matrix.room }}
          path: qa/research-source/
          retention-days: 3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          npm ci
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
          npm run build
          node scripts/stamp-build.mjs v40-laboratory-33
      - name: Capture original-actor gameplay and explore alternate paths
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >research-preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/research-browser.mjs
          RECORD=0 ALTERNATE=1 OUT_DIR=qa/research-alternative node scripts/research-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-first-native-${{ matrix.room }}
          path: |
            qa/research-browser/
            qa/research-alternative/
            research-preview.log
          retention-days: 14
