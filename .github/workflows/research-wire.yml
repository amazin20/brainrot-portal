name: Wire and inspect research chapter
on:
  push:
    branches: [feat/laboratory-chapter-31-33]
    paths: [.github/workflows/research-wire.yml]
permissions:
  contents: read
jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
      - name: Append the new registry entries and extend existing release gates
        run: python3 .github/research-wire.py
      - name: Commit the readable integration to this branch only
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game scripts tests docs .github
          git diff --cached --stat
          git commit -m "Integrate laboratory rooms31–33 and extend every campaign release count"
          git push origin HEAD:feat/laboratory-chapter-31-33
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/research-source
          git rev-parse HEAD > /tmp/research-source/COMMIT
          git rev-parse HEAD^{tree} > /tmp/research-source/TREE
          git archive --format=tar.gz HEAD > /tmp/research-source/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: research-integrated-source
          path: /tmp/research-source/
          retention-days: 3
  native:
    needs: wire
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        room: [31, 32, 33]
    env:
      BUILD_COMMIT: ${{ needs.wire.outputs.revision }}
      ROOMS: ${{ matrix.room }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.wire.outputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          npm ci
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
          npm run build
          node scripts/stamp-build.mjs v40-laboratory-33
      - name: Capture original-actor gameplay and explore alternate paths
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >research-preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/research-browser.mjs
          RECORD=0 ALTERNATE=1 OUT_DIR=qa/research-alternative node scripts/research-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-first-native-${{ matrix.room }}
          path: |
            qa/research-browser/
            qa/research-alternative/
            research-preview.log
          retention-days: 14
