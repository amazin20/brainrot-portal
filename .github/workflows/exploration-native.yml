name: Player exploration native verification
on:
  push:
    branches: [fix/player-exploration-20260922]
    paths: [.github/workflows/exploration-native.yml]
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply the exact readable source patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,lzma,hashlib,re
          data=''.join(Path(f'qa/transfer/exploration-{i}.b64').read_text().strip() for i in range(4))
          patch=lzma.decompress(base64.b64decode(data,validate=True))
          expected='5fede8c0dea3ac14800cae606abdf4656f38680f4ba66583fa7e4b963ca944de'
          assert hashlib.sha256(patch).hexdigest()==expected, 'Patch identity mismatch'
          paths=re.findall(rb'^diff --git a/(\S+) b/(\S+)$',patch,re.M)
          assert paths and all(a==b and a.startswith((b'src/game/',b'scripts/',b'tests/',b'docs/')) and b'..' not in a for a,b in paths)
          Path('/tmp/player-exploration.patch').write_bytes(patch)
          print('Verified',expected,'bytes',len(patch),'files',len(paths))
          PY
          git apply --check /tmp/player-exploration.patch
          git apply /tmp/player-exploration.patch
          rm qa/transfer/exploration-{0,1,2,3}.b64
      - name: Commit source on the repair branch without changing workflow permissions
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game scripts tests docs qa/transfer
          git commit -m "Fix floor-portal backing and swept ramp contacts; build legible enclosed hydraulic laboratory"
          git push origin HEAD:fix/player-exploration-20260922
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  native:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        room: [24, 28, 30]
    env:
      BUILD_COMMIT: ${{ needs.apply.outputs.revision }}
      ROOM: ${{ matrix.room }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          npm ci
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
          npm run build
          node scripts/stamp-build.mjs v39-campaign-30
      - name: Record real routes with full collision and new enclosed architecture
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >exploration-preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/open-browser-review.mjs
      - name: Encode the actual captured motion frames
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -y -framerate 15 -i "qa/open-browser/${ROOM}-motion/%05d.png" -c:v libx264 -crf 20 -pix_fmt yuv420p -movflags +faststart "qa/open-browser/${ROOM}-motion.mp4"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exploration-native-${{ matrix.room }}
          path: |
            qa/open-browser/*.png
            qa/open-browser/*.json
            qa/open-browser/*.mp4
            exploration-preview.log
            dist/build-info.json
          retention-days: 14
  profile:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cb882f9b3e6dc200dedd3ab05a4b3fb0fa9f7faa
          path: before
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.revision }}
          path: after
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Same measurement script, browser and runner for both revisions
        run: |
          cp after/scripts/profile-exploration.mjs before/scripts/profile-exploration.mjs
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          ROOT="$PWD"
          mkdir -p "$ROOT/profile-evidence"
          for VERSION in before after; do
            cd "$ROOT/$VERSION"
            npm ci
            npm install --no-save --package-lock=false puppeteer-core@24.16.0
            npm run build
            BUILD_COMMIT="$(git rev-parse HEAD)" node scripts/stamp-build.mjs v39-campaign-30
            if [ "$VERSION" = before ]; then PORT=4174; else PORT=4175; fi
            npm run preview -- --host 127.0.0.1 --port "$PORT" >"$ROOT/profile-evidence/$VERSION-preview.log" 2>&1 &
            for i in {1..30}; do curl -fsS "http://127.0.0.1:$PORT/" >/dev/null && break; sleep 1; done
            PAGE_URL="http://127.0.0.1:$PORT/" OUT="$ROOT/profile-evidence/$VERSION" node scripts/profile-exploration.mjs
            cp dist/build-info.json "$ROOT/profile-evidence/$VERSION/build-info.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exploration-portal-before-after
          path: profile-evidence/
          retention-days: 14
