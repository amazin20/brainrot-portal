name: Research source integration only
on:
  push:
    branches: [feat/laboratory-chapter-31-33]
    paths: [.github/workflows/research-source-only.yml]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Integrate only files covered by contents permission
        run: |
          python3 .github/research-source-only.py
          git diff --exit-code -- .github
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts tests docs README.md
          if git diff --cached --name-only | grep '^.github/'; then exit 1; fi
          git commit -m "Append research rooms31–33, preserve prior indices and clarify player feedback"
          git push origin HEAD:feat/laboratory-chapter-31-33
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
