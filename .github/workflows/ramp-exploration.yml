name: Ordinary ramp exploration
on:
  pull_request:
    paths:
      - 'src/game/LabRampContact.js'
      - 'src/game/LabKineticMovement.js'
      - 'src/game/LabOpenLaunch.js'
      - 'src/game/LabRampExplorationJourney.js'
      - 'scripts/ramp-exploration-browser.mjs'
      - '.github/workflows/ramp-exploration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_COMMIT }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          npm ci
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
          npm run build
          node scripts/stamp-build.mjs v40-laboratory-33
      - name: Explore the real inclines from spawn and return without resets
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/ramp-preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/ramp-exploration-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ordinary-ramp-exploration
          path: |
            qa/ramp-exploration/
            /tmp/ramp-preview.log
          retention-days: 14
