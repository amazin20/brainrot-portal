name: Import release safety refinements
on:
  push:
    branches: ['release/tactile-twenty-v17']
    paths: ['.github/workflows/import-release-polish.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Import only the eleven integrity-checked release files
        run: |
          python3 - <<'PY'
          import urllib.request,json,hashlib,zipfile,io,pathlib,stat
          url='https://api.firestorage.ai/dev/file/shares/NxI602TwrMI_/files/01a07a562eda76d7abe0c1d48e59a696/download'
          with urllib.request.urlopen(urllib.request.Request(url,method='POST'),timeout=30) as r: link=json.load(r)['downloadUrl']
          assert link.startswith('https://')
          with urllib.request.urlopen(link,timeout=30) as r: data=r.read(1000000)
          assert len(data)==36323 and hashlib.sha256(data).hexdigest()=='e0cfb282b65dbd2d38bb3e67431106c50e027d2c676e8d5e40f86224c765084e'
          allowed={'src/game/LabWorkshopCampaign.js','src/game/LabWorkshopKit.js','src/game/LabV8Journey.js','src/game/LabWorkshopRecovery.js','src/main.js','scripts/v8-browser.mjs','scripts/v17-recovery.mjs','tests/lab-workshop-safety.test.js','docs/RELEASE_V17.md','PROJECT_STATUS.md','README.md'}
          z=zipfile.ZipFile(io.BytesIO(data));assert z.testzip() is None and set(z.namelist())==allowed
          for entry in z.infolist():
              assert not stat.S_ISLNK(entry.external_attr>>16)
              p=pathlib.Path(entry.filename);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(z.read(entry))
          print('All eleven source files imported intact')
          PY
      - name: Commit the exact reviewed source without changing published main
        run: |
          test "$GITHUB_REF_NAME" = 'release/tactile-twenty-v17'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts tests docs PROJECT_STATUS.md README.md
          git diff --cached --quiet || git commit -m 'Guard roller receiver, recover missed wind ferry, smooth rotors and animate winches'
          git push origin HEAD:refs/heads/release/tactile-twenty-v17
      - name: Recheck all code and twenty production-physics journeys
        run: |
          npm ci
          npm run check
          node scripts/v8-package-check.mjs
          node scripts/v8-journey.mjs
          node scripts/v10-shortcuts.mjs
          node scripts/v17-audit.mjs
          node scripts/v17-recovery.mjs
      - name: Preserve updated source checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v17-polish-physics
          path: |
            qa/v8-journeys.json
            qa/v10-shortcut-audit.json
            qa/v17-adversarial.json
            qa/v17-recovery.json
          retention-days: 7
